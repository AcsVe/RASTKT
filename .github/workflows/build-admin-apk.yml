name: Build Admin Android APK (support team)

# Builds the support-team (admin) Android app: a Capacitor shell around the staff mobile app /admin/m/
# (blueprints/mobile.py, static/m/) with native back button, notifications, haptics and status bar, and
# publishes it as a GitHub Release asset with a stable link:
#   https://github.com/<owner>/<repo>/releases/download/admin-apk-latest/RASTKT-Admin.apk
# (the admin panel's «تطبيق فريق الدعم (APK)» link uses it). The teachers' app (build-apk.yml) is separate.
#
# Server URL: the "app_url" input below (manual runs), else the repository
# variable ADMIN_APP_URL (Settings → Secrets and variables → Actions → Variables),
# else https://1.iajaward.org (the school server, where the staff accounts are).
#
# Signing (optional but recommended): without the secrets below the APK is
# debug-signed with a throw-away key — it installs fine, but every build has
# a different signature, so installing a NEWER build over an older one
# requires uninstalling first. Add these repository secrets once and every
# build is signed with the same key, so updates install over the old app:
#   ANDROID_KEYSTORE_BASE64   (base64 of your .jks/.keystore file)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD      (omit if same as the keystore password)

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Site URL the app should open (blank = APP_URL variable / default)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "android-admin/**"
      - ".github/workflows/build-admin-apk.yml"
      - "static/icon-512.png"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ inputs.app_url || vars.ADMIN_APP_URL || 'https://1.iajaward.org' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK (ANDROID_HOME); the
      # separate setup-android action's sdkmanager step fails on current
      # images, so just accept licenses and let Gradle fetch any missing piece.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare icon sources (from the site's own icon)
        run: |
          mkdir -p android-admin/assets
          cp static/icon-512.png android-admin/assets/icon-only.png
          cp static/icon-512.png android-admin/assets/icon-foreground.png

      - name: Install dependencies
        working-directory: android-admin
        run: npm install --no-audit --no-fund

      - name: Write Capacitor config
        working-directory: android-admin
        run: node scripts/configure.js

      - name: Add Android platform
        working-directory: android-admin
        run: npx cap add android

      - name: Generate launcher icons
        working-directory: android-admin
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0847B0' --iconBackgroundColorDark '#0847B0' --splashBackgroundColor '#0847B0' --splashBackgroundColorDark '#0847B0'

      # capacitor-assets writes the adaptive-icon XMLs pointing at
      # @mipmap/ic_launcher_background, but only creates a *color* resource
      # with that name — repoint to @color and use the app's navy.
      - name: Fix adaptive icon background reference
        working-directory: android-admin/android/app/src/main/res
        run: |
          sed -i 's#@mipmap/ic_launcher_background#@color/ic_launcher_background#g' mipmap-anydpi-v26/*.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#1B3358</color>\n</resources>\n' > values/ic_launcher_background.xml
          cat mipmap-anydpi-v26/ic_launcher.xml values/ic_launcher_background.xml

      # A white notification icon (Android shows the small icon as a silhouette), and a version code that
      # grows with every build so a new APK installs over the old one.
      - name: Notification icon and version
        working-directory: android-admin/android/app
        run: |
          mkdir -p src/main/res/drawable
          cat > src/main/res/drawable/ic_stat_icon.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.9,2 2,2zM18,16v-5c0,-3.07 -1.64,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5s-1.5,0.67 -1.5,1.5v0.68C7.63,5.36 6,7.92 6,11v5l-2,2v1h16v-1l-2,-2z"/>
          </vector>
          XML
          N=${{ github.run_number }}
          sed -i -E "s/versionCode [0-9]+/versionCode $N/; s/versionName \"[^\"]*\"/versionName \"1.0.$N\"/" build.gradle
          grep -n "versionCode\|versionName" build.gradle

      - name: Sync web assets
        working-directory: android-admin
        run: npx cap sync android

      - name: Build APK
        working-directory: android-admin/android
        env:
          HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          chmod +x gradlew
          if [ "$HAVE_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Sign / collect APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p out
          OUT=android-admin/android/app/build/outputs/apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f -p 4 "$OUT/release/app-release-unsigned.apk" aligned.apk
            "$BT/apksigner" sign --ks release.keystore --ks-pass "pass:$KS_PASS" \
              --ks-key-alias "$KEY_ALIAS" --key-pass "pass:${KEY_PASS:-$KS_PASS}" \
              --out out/RASTKT-Admin.apk aligned.apk
            rm -f release.keystore aligned.apk
          else
            echo "::warning::No signing secrets set — using a debug-signed APK (updates need uninstall/reinstall)."
            cp "$OUT/debug/app-debug.apk" out/RASTKT-Admin.apk
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: RASTKT-Admin-apk
          path: out/RASTKT-Admin.apk

      - name: Publish release (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete admin-apk-latest --cleanup-tag --yes || true
          gh release create admin-apk-latest out/RASTKT-Admin.apk \
            --title "RASTKT support team app" \
            --notes "Support team Android app (opens $APP_URL/admin/m/). Built from ${GITHUB_SHA::7}." \
            --latest=false
