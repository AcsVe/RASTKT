<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ 'شاشة المتابعة' if lang == 'ar' else 'Monitoring' }} — {{ config.ORG_AR }}</title>

<!-- PWA: Add to Home Screen (Android + iOS + Desktop) — same manifest/service
     worker as the rest of the site, so this screen can be installed and
     opened standalone (e.g. pinned as a dedicated office/TV display). -->
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#1B3358">
<link rel="icon" href="/static/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{ 'المتابعة' if lang == 'ar' else 'Monitoring' }}">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #FF5733; --secondary: #2E4E7A; --secondary-dark: #1B3358;
  --accent: {{ config.ACCENT_COLOR }};
  --bg: #f0f4f5; --white: #fff; --text: #1e2a2b; --muted: #6b7c7e; --border: #d4e4e6;
  --green: #27ae60; --red: #c0392b; --orange: #e67e22; --blue: #2E4E7A;
}
* , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
/* _ticker.html positions itself fixed at top:0 regardless of the page
   around it; this page's own header is normal in-flow (not fixed), so
   push it down by the ticker's fixed 38px height once the ticker
   actually has content to show (JS adds .has-ticker to body — see
   _ticker.html). */
body.has-ticker header { margin-top: 38px; }
header {
  background: linear-gradient(135deg, var(--secondary-dark), var(--secondary));
  color: #fff; padding: 14px 22px; display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.2);
}
header .brand { display: flex; align-items: center; gap: 12px; }
header .brand img { height: 42px; background: #fff; border-radius: 8px; padding: 4px; }
header h1 { font-size: 1.15rem; font-weight: 800; }
header .sub { font-size: .78rem; opacity: .8; }
header .tools { display: flex; align-items: center; gap: 10px; }
header button, header a.tool-btn {
  background: rgba(255,255,255,.15); border: none; color: #fff; padding: 7px 14px;
  border-radius: 8px; font-weight: 700; font-size: .8rem; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
}
header button:hover, header a.tool-btn:hover { background: rgba(255,255,255,.28); }
main { padding: 20px; max-width: 1400px; margin: 0 auto; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat-card {
  background: var(--white); border-radius: 12px; padding: 16px; text-align: center;
  box-shadow: 0 2px 10px rgba(0,0,0,.06); border-top: 4px solid var(--primary);
}
.stat-card.green { border-top-color: var(--green); } .stat-card.red { border-top-color: var(--red); }
.stat-card.orange { border-top-color: var(--orange); } .stat-card.blue { border-top-color: var(--blue); }
.stat-val { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
.stat-card.green .stat-val { color: var(--green); } .stat-card.red .stat-val { color: var(--red); }
.stat-card.orange .stat-val { color: var(--orange); } .stat-card.blue .stat-val { color: var(--blue); }
.stat-label { font-size: .78rem; color: var(--muted); font-weight: 700; margin-top: 4px; }

.panel { background: var(--white); border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06); padding: 18px; margin-bottom: 18px; }
.panel h2 { font-size: .95rem; font-weight: 800; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

.reports-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 820px) { .reports-grid { grid-template-columns: 1fr; } }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: .82rem; }
.bar-row .lbl { width: 150px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.bar-row .track { flex: 1; background: #eef2f3; border-radius: 6px; height: 14px; overflow: hidden; }
.bar-row .fill { height: 100%; background: var(--primary); border-radius: 6px; }
.bar-row .val { width: 34px; text-align: end; font-weight: 800; color: var(--primary); flex-shrink: 0; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .85rem; }
th, td { padding: 9px 10px; text-align: start; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--muted); font-weight: 800; font-size: .76rem; text-transform: uppercase; }
tr:hover td { background: #fafcfc; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: .74rem; font-weight: 800; }
.badge-open { background: #fdecea; color: var(--red); }
.badge-in_progress { background: #eaf2fb; color: var(--blue); }
.badge-waiting { background: #fff6e5; color: #b5820a; }
.badge-closed { background: #e9f8ef; color: var(--green); }
.priority-low { color: var(--green); } .priority-medium { color: #b5820a; } .priority-high { color: var(--red); font-weight: 800; }

.filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.filters button {
  background: #eef2f3; border: none; padding: 6px 14px; border-radius: 20px; font-size: .8rem;
  font-weight: 700; cursor: pointer; font-family: inherit; color: var(--text);
}
.filters button.active { background: var(--primary); color: #fff; }

.empty { text-align: center; color: var(--muted); padding: 24px; font-size: .85rem; }
footer { text-align: center; padding: 16px; font-size: .74rem; color: var(--muted); }
</style>
</head>
<body>

{% include "_ticker.html" %}

<header>
  <div class="brand">
    <div>
      <h1 id="pageTitle"></h1>
      <div class="sub" id="pageSub"></div>
    </div>
  </div>
  <div class="tools">
    <span class="sub" id="clock" style="font-size:.85rem;font-weight:700"></span>
    <a href="#" class="tool-btn" id="installAppBtn" onclick="handleInstallClick(event)" style="display:none"></a>
    <button onclick="toggleLang()" id="langBtn"></button>
    <button onclick="loadAll()" id="refreshBtn"><i class="fas fa-rotate"></i></button>
  </div>
</header>

<main>
  <div class="stats-grid" id="statsGrid"></div>

  <div class="panel">
    <h2><i class="fas fa-chart-pie"></i> <span id="reportsTitle"></span></h2>
    <div class="reports-grid">
      <div>
        <h3 style="font-size:.8rem;color:var(--muted);margin-bottom:8px" id="byCategoryLbl"></h3>
        <div id="byCategoryChart"></div>
      </div>
      <div>
        <h3 style="font-size:.8rem;color:var(--muted);margin-bottom:8px" id="byPriorityLbl"></h3>
        <div id="byPriorityChart"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2><i class="fas fa-list"></i> <span id="ticketsTitle"></span></h2>
    <div class="filters" id="statusFilters"></div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th id="thSerial"></th><th id="thCategory"></th><th id="thSubject"></th>
          <th id="thPriority"></th><th id="thAssignee"></th><th id="thStatus"></th><th id="thDate"></th>
        </tr></thead>
        <tbody id="ticketsBody"></tbody>
      </table>
    </div>
  </div>
</main>

<footer id="footerNote"></footer>

<script>
let AR = new URLSearchParams(location.search).get('lang') !== 'en';
let STATS = null, TICKETS = [], statusFilter = 'all';

const STR = {
  title: { ar: 'شاشة المتابعة', en: 'Monitoring' },
  sub: { ar: 'عرض تفاصيل التذاكر والتقارير — بدون تسجيل دخول', en: 'Ticket details & reports — no login required' },
  refresh: { ar: 'تحديث', en: 'Refresh' },
  reports: { ar: 'التقارير', en: 'Reports' },
  byCategory: { ar: 'حسب التصنيف', en: 'By Category' },
  byPriority: { ar: 'حسب الأولوية', en: 'By Priority' },
  tickets: { ar: 'التذاكر', en: 'Tickets' },
  serial: { ar: 'الرقم', en: '#' }, category: { ar: 'التصنيف', en: 'Category' },
  subject: { ar: 'الموضوع', en: 'Subject' }, priority: { ar: 'الأولوية', en: 'Priority' },
  assignee: { ar: 'الموظف المسؤول', en: 'Assignee' }, status: { ar: 'الحالة', en: 'Status' },
  date: { ar: 'التاريخ', en: 'Date' },
  total: { ar: 'الإجمالي', en: 'Total' }, open: { ar: 'مفتوحة', en: 'Open' },
  in_progress: { ar: 'قيد المعالجة', en: 'In Progress' }, waiting: { ar: 'بانتظار الرد (Waiting)', en: 'Waiting' },
  closed: { ar: 'مغلقة', en: 'Closed' }, all: { ar: 'الكل', en: 'All' },
  low: { ar: 'منخفضة', en: 'Low' }, medium: { ar: 'متوسطة', en: 'Medium' }, high: { ar: 'عالية', en: 'High' },
  unassigned: { ar: 'غير معيّن', en: 'Unassigned' }, empty: { ar: 'لا توجد نتائج', en: 'No results' },
  install: { ar: 'تثبيت', en: 'Install' },
  footer: { ar: 'هذه الشاشة للعرض فقط ولا تتضمن أي إجراءات إدارية أو بيانات اتصال المعلمين.',
            en: 'This screen is read-only — no admin actions and no teacher contact details are shown here.' },
};
function s(key) { return STR[key][AR ? 'ar' : 'en']; }
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toggleLang() {
  AR = !AR;
  document.documentElement.lang = AR ? 'ar' : 'en';
  document.documentElement.dir = AR ? 'rtl' : 'ltr';
  const u = new URL(location.href); u.searchParams.set('lang', AR ? 'ar' : 'en'); history.replaceState(null, '', u);
  renderAll();
}

function renderClock() {
  document.getElementById('clock').textContent = new Date().toLocaleString(AR ? 'ar' : 'en-GB', { hour12: false });
}
setInterval(renderClock, 1000); renderClock();

async function loadAll() {
  try {
    const [stats, tickets] = await Promise.all([
      fetch('/api/monitoring/stats').then(r => r.json()),
      fetch('/api/monitoring/tickets' + (statusFilter !== 'all' ? '?status=' + statusFilter : '')).then(r => r.json()),
    ]);
    STATS = stats; TICKETS = tickets;
    renderAll();
  } catch (e) { console.error(e); }
}

function renderAll() {
  document.getElementById('pageTitle').textContent = s('title');
  document.getElementById('pageSub').textContent = s('sub');
  document.getElementById('langBtn').textContent = AR ? 'EN' : 'عربي';
  document.getElementById('refreshBtn').innerHTML = `<i class="fas fa-rotate"></i> ${s('refresh')}`;
  document.getElementById('installAppBtn').innerHTML = `<i class="fas fa-download"></i> ${s('install')}`;
  document.getElementById('reportsTitle').textContent = s('reports');
  document.getElementById('byCategoryLbl').textContent = s('byCategory');
  document.getElementById('byPriorityLbl').textContent = s('byPriority');
  document.getElementById('ticketsTitle').textContent = s('tickets');
  document.getElementById('footerNote').textContent = s('footer');
  document.getElementById('thSerial').textContent = s('serial');
  document.getElementById('thCategory').textContent = s('category');
  document.getElementById('thSubject').textContent = s('subject');
  document.getElementById('thPriority').textContent = s('priority');
  document.getElementById('thAssignee').textContent = s('assignee');
  document.getElementById('thStatus').textContent = s('status');
  document.getElementById('thDate').textContent = s('date');

  if (STATS) {
    const cards = [
      ['total', STATS.total, ''], ['open', STATS.byStatus.open, 'red'],
      ['in_progress', STATS.byStatus.in_progress, 'blue'], ['waiting', STATS.byStatus.waiting, 'orange'],
      ['closed', STATS.byStatus.closed, 'green'],
    ];
    document.getElementById('statsGrid').innerHTML = cards.map(([key, val, cls]) => `
      <div class="stat-card ${cls}"><div class="stat-val">${val ?? 0}</div><div class="stat-label">${s(key)}</div></div>
    `).join('');

    const maxCat = Math.max(1, ...Object.values(STATS.byCategory || {}));
    document.getElementById('byCategoryChart').innerHTML = Object.entries(STATS.byCategory || {}).map(([name, val]) => `
      <div class="bar-row"><span class="lbl" title="${esc(name)}">${esc(name)}</span>
      <span class="track"><span class="fill" style="width:${(val / maxCat * 100).toFixed(0)}%"></span></span>
      <span class="val">${val}</span></div>
    `).join('') || `<div class="empty">${s('empty')}</div>`;

    const maxPri = Math.max(1, ...Object.values(STATS.byPriority || {}));
    document.getElementById('byPriorityChart').innerHTML = ['low', 'medium', 'high'].map(p => `
      <div class="bar-row"><span class="lbl">${s(p)}</span>
      <span class="track"><span class="fill" style="width:${((STATS.byPriority[p]||0) / maxPri * 100).toFixed(0)}%"></span></span>
      <span class="val">${STATS.byPriority[p] || 0}</span></div>
    `).join('');
  }

  const filters = ['all', 'open', 'in_progress', 'waiting', 'closed'];
  document.getElementById('statusFilters').innerHTML = filters.map(f => `
    <button class="${statusFilter === f ? 'active' : ''}" onclick="setStatusFilter('${f}')">${s(f)}</button>
  `).join('');

  document.getElementById('ticketsBody').innerHTML = TICKETS.map(tk => {
    const created = (tk.createdAt || '').replace('T', ' ').slice(0, 16);
    return `<tr>
      <td><strong style="color:var(--primary)">#${tk.serial}</strong></td>
      <td>${esc(tk.category)}${tk.categoryItem ? ' / ' + esc(tk.categoryItem) : ''}</td>
      <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(tk.subject)}">${esc(tk.subject)}</td>
      <td><span class="priority-${tk.priority}">${s(tk.priority)}</span></td>
      <td>${esc(tk.assigneeName || s('unassigned'))}</td>
      <td><span class="badge badge-${tk.status}">${s(tk.status)}</span></td>
      <td>${created}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="7" class="empty">${s('empty')}</td></tr>`;
}

function setStatusFilter(f) { statusFilter = f; loadAll(); }

document.documentElement.lang = AR ? 'ar' : 'en';
document.documentElement.dir = AR ? 'rtl' : 'ltr';
loadAll();
setInterval(loadAll, 60000); // auto-refresh — this page is meant to stay open unattended (e.g. an office screen)

// ── PWA: installable + offline-friendly, same as the rest of the site ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
let deferredInstallPrompt = null;
const installBtn = document.getElementById('installAppBtn');
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
if (!isStandalone) {
  if (isIOS) {
    if (installBtn) installBtn.style.display = 'flex';
  } else {
    window.addEventListener('beforeinstallprompt', (e) => {
      deferredInstallPrompt = e;
      if (installBtn) installBtn.style.display = 'flex';
    });
  }
}
function handleInstallClick(e) {
  e.preventDefault();
  if (isIOS) {
    alert(AR
      ? 'لإضافة الشاشة للشاشة الرئيسية:\n١) اضغط زر المشاركة ⬆️ بأسفل الشاشة\n٢) اختر "Add to Home Screen"'
      : 'To add this to your Home Screen:\n1) Tap the Share button ⬆️\n2) Choose "Add to Home Screen"');
    return;
  }
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(() => {
      deferredInstallPrompt = null;
      if (installBtn) installBtn.style.display = 'none';
    });
  }
}
window.addEventListener('appinstalled', () => { if (installBtn) installBtn.style.display = 'none'; });
</script>
</body>
</html>
