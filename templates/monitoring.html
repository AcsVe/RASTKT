<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ 'المراقبة' if lang == 'ar' else 'Monitoring' }} — {{ config.ORG_AR }}</title>
<link rel="icon" href="/static/icon-192.png" type="image/png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #FF5733; --secondary: #2E4E7A; --secondary-dark: #1B3358;
  --accent: {{ config.ACCENT_COLOR }};
  --bg: #f0f4f5; --text: #1e2a2b; --muted: #6b7c7e; --border: #d4e4e6; --radius: 12px;
}
/* This page is deliberately its own, minimal shell (not the full admin
   dashboard chrome) — it must never grow login-only controls; see the
   monitoring feature note in README. */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: {% if lang == 'ar' %}'Tajawal'{% else %}'Inter'{% endif %}, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}
.topbar { background: linear-gradient(135deg, var(--secondary-dark), var(--secondary)); color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.topbar h1 { font-size: 1.05rem; font-weight: 800; }
.topbar .sub { font-size: .78rem; opacity: .8; }
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.lang-link { color: #fff; background: rgba(255,255,255,.12); padding: 6px 12px; border-radius: 8px; font-size: .8rem; font-weight: 700; text-decoration: none; }
.tabs { display: flex; gap: 6px; padding: 14px 20px 0; }
.tab-btn { background: #fff; border: 1.5px solid var(--border); border-bottom: none; padding: 9px 18px; border-radius: 10px 10px 0 0; font-family: inherit; font-weight: 700; font-size: .88rem; color: var(--muted); cursor: pointer; }
.tab-btn.active { color: var(--primary); background: #fff; box-shadow: 0 -2px 8px rgba(0,0,0,.04); }
.wrap { padding: 0 20px 30px; }
.card { background: #fff; border-radius: var(--radius); box-shadow: 0 2px 12px rgba(0,0,0,.06); padding: 20px; margin-top: 14px; }
.tab-panel { display: none; } .tab-panel.active { display: block; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 14px; }
.stat { background: #fff; border-radius: var(--radius); padding: 16px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,.06); border-top: 4px solid var(--primary); }
.stat b { display: block; font-size: 1.7rem; color: var(--primary); }
.stat span { font-size: .78rem; color: var(--muted); font-weight: 700; }

.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
select.plain, input.search { padding: 7px 10px; border-radius: 8px; border: 1.5px solid var(--border); font-family: inherit; font-size: .85rem; }
input.search { flex: 1; min-width: 180px; }

table { width: 100%; border-collapse: collapse; font-size: .86rem; }
th { background: #f0f7f8; color: var(--primary); font-weight: 700; padding: 9px 10px; text-align: start; white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
tr.clickable { cursor: pointer; } tr.clickable:hover td { background: #fafefe; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: .74rem; font-weight: 700; }
.badge-open { background: #fff3cd; color: #856404; }
.badge-in_progress { background: #cfe2ff; color: #0b3d91; }
.badge-waiting { background: #ffe5d0; color: #a3540c; }
.badge-closed { background: #d1e7dd; color: #0a6640; }
.priority-low { color: #6b7c7e; } .priority-medium { color: #1a5fb4; } .priority-high { color: #c0392b; font-weight: 800; }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 30px 12px; }
.modal-overlay.open { display: flex; }
.modal { background: #fff; border-radius: 16px; padding: 22px; max-width: 560px; width: 100%; box-shadow: 0 12px 50px rgba(0,0,0,.22); }
.modal-title { font-size: 1.02rem; font-weight: 800; color: var(--primary); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.modal-close { background: none; border: none; font-size: 1.15rem; cursor: pointer; color: var(--muted); }
.k { font-size: .74rem; color: var(--muted); font-weight: 700; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin: 10px 0; font-size: .88rem; }
@media (max-width: 640px) { .detail-grid { grid-template-columns: 1fr; } td[data-label]::before { content: attr(data-label) ": "; font-weight: 700; color: var(--muted); } }
</style>
</head>
<body>
<div class="topbar">
  <div>
    <h1>{{ 'شاشة المراقبة' if lang == 'ar' else 'Monitoring Screen' }}</h1>
    <div class="sub">{{ config.ORG_AR }} — {{ config.ORG_EN }}</div>
  </div>
  <div class="topbar-actions">
    <a class="lang-link" href="?lang={{ 'en' if lang == 'ar' else 'ar' }}">{{ 'EN' if lang == 'ar' else 'عربي' }}</a>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tabBtnTickets" onclick="showTab('tickets')"><i class="fas fa-ticket-alt"></i> <span id="lblTicketsTab"></span></button>
  <button class="tab-btn" id="tabBtnReports" onclick="showTab('reports')"><i class="fas fa-chart-pie"></i> <span id="lblReportsTab"></span></button>
</div>

<div class="wrap">
  <div class="tab-panel active" id="panel-tickets">
    <div class="card">
      <div class="filter-bar">
        <input type="text" class="search" id="searchBox" oninput="renderTickets()" placeholder="">
        <select class="plain" id="filterStatus" onchange="loadTickets()"></select>
      </div>
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th id="thSerial"></th><th id="thTeacher"></th><th id="thCategory"></th>
          <th id="thSubject"></th><th id="thPriority"></th><th id="thAssignee"></th>
          <th id="thStatus"></th><th id="thDate"></th>
        </tr></thead>
        <tbody id="ticketsBody"></tbody>
      </table>
      </div>
    </div>
  </div>

  <div class="tab-panel" id="panel-reports">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="card">
      <div class="k" style="font-size:.85rem;margin-bottom:8px" id="byCategoryTitle"></div>
      <table><tbody id="byCategoryBody"></tbody></table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="detailModal" onclick="if(event.target===this) closeDetail()">
  <div class="modal" id="detailModalBody"></div>
</div>

<script>
const AR = '{{ lang }}' !== 'en';
const I18N_EN = {
  'التذاكر': 'Tickets', 'التقارير': 'Reports', 'الرقم': 'Serial', 'المعلم': 'Teacher',
  'التصنيف': 'Category', 'الموضوع': 'Subject', 'الأولوية': 'Priority', 'الموظف المسؤول': 'Assignee',
  'الحالة': 'Status', 'التاريخ': 'Date', 'مفتوحة': 'Open', 'قيد المعالجة': 'In Progress',
  'بانتظار الرد': 'Waiting', 'مغلقة': 'Closed', 'كل الحالات': 'All Statuses',
  'بحث بالرقم أو الموضوع أو اسم المعلم...': 'Search by serial, subject, or teacher name...',
  'غير معينة': 'Unassigned', 'الإجمالي': 'Total', 'منخفضة': 'Low', 'متوسطة': 'Medium', 'عالية': 'High',
  'متوسط زمن الإغلاق (ساعة)': 'Avg. Close Time (hours)', '—': '—', 'لا توجد نتائج': 'No results',
  'حسب التصنيف': 'By Category', 'تفاصيل التذكرة': 'Ticket Details', 'إغلاق النافذة': 'Close window',
  'الوصف': 'Description', 'سجل المتابعة (العلني)': 'Follow-up Log (public)', 'لا توجد تعليقات بعد': 'No comments yet',
  'الدعم الفني': 'IT Support',
};
function t(s) { return AR ? s : (I18N_EN[s] || s); }

function showTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  document.getElementById('tabBtn' + name[0].toUpperCase() + name.slice(1)).classList.add('active');
  if (name === 'reports') loadStats();
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function statusLabel(s) { return t({open:'مفتوحة',in_progress:'قيد المعالجة',waiting:'بانتظار الرد',closed:'مغلقة'}[s] || s); }
function priorityLabel(p) { return t({low:'منخفضة',medium:'متوسطة',high:'عالية'}[p] || p); }

let TICKETS = [];
async function loadTickets() {
  const status = document.getElementById('filterStatus').value;
  const r = await fetch('/api/monitoring/tickets' + (status ? `?status=${status}` : ''));
  TICKETS = await r.json();
  renderTickets();
}
function renderTickets() {
  const q = (document.getElementById('searchBox').value || '').toLowerCase();
  let rows = TICKETS;
  if (q) rows = rows.filter(r => (String(r.serial) + r.subject + r.teacherName).toLowerCase().includes(q));
  document.getElementById('ticketsBody').innerHTML = rows.map(tk => `
    <tr class="clickable" onclick="openDetail(${tk.serial})">
      <td data-label="${t('الرقم')}"><strong style="color:var(--primary)">#${tk.serial}</strong></td>
      <td data-label="${t('المعلم')}">${esc(tk.teacherName)}</td>
      <td data-label="${t('التصنيف')}">${esc(tk.category)}${tk.categoryItem ? ' / ' + esc(tk.categoryItem) : ''}</td>
      <td data-label="${t('الموضوع')}" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(tk.subject)}</td>
      <td data-label="${t('الأولوية')}"><span class="priority-${tk.priority}">${priorityLabel(tk.priority)}</span></td>
      <td data-label="${t('الموظف المسؤول')}">${esc(tk.assigneeName || t('غير معينة'))}</td>
      <td data-label="${t('الحالة')}"><span class="badge badge-${tk.status}">${statusLabel(tk.status)}</span></td>
      <td data-label="${t('التاريخ')}">${(tk.createdAt || '').split('T')[0] || ''}</td>
    </tr>`).join('') || `<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:18px">${t('لا توجد نتائج')}</td></tr>`;
}

// Builds the detail modal straight from the row data already fetched
// into TICKETS — no separate per-ticket endpoint needed.
function openDetail(serial) {
  const tk = TICKETS.find(x => x.serial === serial);
  if (!tk) return;
  document.getElementById('detailModalBody').innerHTML = `
    <div class="modal-title">
      <span>#${tk.serial} — ${esc(tk.subject)}</span>
      <button class="modal-close" onclick="closeDetail()" title="${t('إغلاق النافذة')}"><i class="fas fa-times"></i></button>
    </div>
    <span class="badge badge-${tk.status}">${statusLabel(tk.status)}</span>
    <div class="detail-grid">
      <div><div class="k">${t('المعلم')}</div>${esc(tk.teacherName)}</div>
      <div><div class="k">${t('التصنيف')}</div>${esc(tk.category)}${tk.categoryItem ? ' / ' + esc(tk.categoryItem) : ''}</div>
      <div><div class="k">${t('الأولوية')}</div><span class="priority-${tk.priority}">${priorityLabel(tk.priority)}</span></div>
      <div><div class="k">${t('الموظف المسؤول')}</div>${esc(tk.assigneeName || t('غير معينة'))}</div>
    </div>
  `;
  document.getElementById('detailModal').classList.add('open');
}
function closeDetail() { document.getElementById('detailModal').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

async function loadStats() {
  const s = await (await fetch('/api/monitoring/stats')).json();
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat"><b>${s.total}</b><span>${t('الإجمالي')}</span></div>
    <div class="stat"><b>${s.byStatus.open}</b><span>${t('مفتوحة')}</span></div>
    <div class="stat"><b>${s.byStatus.in_progress}</b><span>${t('قيد المعالجة')}</span></div>
    <div class="stat"><b>${s.byStatus.waiting}</b><span>${t('بانتظار الرد')}</span></div>
    <div class="stat"><b>${s.byStatus.closed}</b><span>${t('مغلقة')}</span></div>
    <div class="stat"><b>${s.avgCloseHours != null ? s.avgCloseHours : t('—')}</b><span>${t('متوسط زمن الإغلاق (ساعة)')}</span></div>
  `;
  document.getElementById('byCategoryTitle').textContent = t('حسب التصنيف');
  document.getElementById('byCategoryBody').innerHTML = Object.entries(s.byCategory)
    .map(([name, count]) => `<tr><td>${esc(name || '—')}</td><td style="text-align:end;font-weight:700">${count}</td></tr>`).join('');
}

function init() {
  document.getElementById('lblTicketsTab').textContent = t('التذاكر');
  document.getElementById('lblReportsTab').textContent = t('التقارير');
  document.getElementById('searchBox').placeholder = t('بحث بالرقم أو الموضوع أو اسم المعلم...');
  document.getElementById('filterStatus').innerHTML =
    `<option value="">${t('كل الحالات')}</option><option value="open">${t('مفتوحة')}</option>` +
    `<option value="in_progress">${t('قيد المعالجة')}</option><option value="waiting">${t('بانتظار الرد')}</option>` +
    `<option value="closed">${t('مغلقة')}</option>`;
  loadTickets();
  setInterval(loadTickets, 60000);
}
init();
</script>
</body>
</html>
