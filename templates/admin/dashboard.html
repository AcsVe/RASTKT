<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ 'لوحة التحكم' if lang == 'ar' else 'Control Panel' }} — {{ brand.org_ar if lang == 'ar' else (brand.org_en or brand.org_ar) }}</title>

<link rel="manifest" href="/static/manifest-admin.json">
<meta name="theme-color" content="#0C67EC">
<link rel="icon" href="/static/brand/system.svg" type="image/svg+xml">
<link rel="icon" href="/static/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{ 'إدارة الطلبات' if lang == 'ar' else 'Ticket Admin' }}">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css?v=3">
<style>:root{--accent:{{ brand.accent }}}</style>
</head>
<body class="app">
{% include "_ticker.html" %}
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<nav class="sidebar" id="sidebar" aria-label="{{ 'القائمة الرئيسية' if lang == 'ar' else 'Main menu' }}">
  <div class="side-brand">
    <img class="brand-logo{{ '' if brand.logo else ' sys-icon' }}" id="sbLogo" src="{{ brand.logo_url }}" alt="">
    <span class="org" id="sbOrg"></span>
    <span class="sys" id="sbSys"></span>
  </div>
  <div class="side-nav">
    <div class="nav-group">
      <div class="nav-group-title" id="ngDaily"></div>
      <button class="nav-item active" onclick="showTab('tickets')" data-tab="tickets"><i class="fas fa-ticket"></i> <span id="navTicketsLbl"></span> <span class="nav-badge" id="nbOpen">0</span></button>
    </div>
    <div class="nav-group">
      <div class="nav-group-title" id="ngLists"></div>
      <button class="nav-item" onclick="showTab('teachers')" data-tab="teachers" id="navTeachBtn"><i class="fas fa-chalkboard-user"></i> <span id="navTeachLbl"></span></button>
      <button class="nav-item" onclick="showTab('categories')" data-tab="categories" id="navCatBtn"><i class="fas fa-tags"></i> <span id="navCatLbl"></span></button>
      <button class="nav-item" onclick="showTab('reports')" data-tab="reports" id="navReportsBtn" style="display:none"><i class="fas fa-chart-column"></i> <span id="navReportsLbl"></span></button>
    </div>
    <div class="nav-group">
      <div class="nav-group-title" id="ngAdmin"></div>
      <button class="nav-item" onclick="showTab('staff')" data-tab="staff" id="navStaffBtn" style="display:none"><i class="fas fa-users-gear"></i> <span id="navStaffLbl"></span></button>
      <button class="nav-item" onclick="showTab('ticker')" data-tab="ticker" id="navTickerBtn" style="display:none"><i class="fas fa-bullhorn"></i> <span id="navTickerLbl"></span></button>
      <button class="nav-item" onclick="showTab('settings')" data-tab="settings" id="navSettingsBtn" style="display:none"><i class="fas fa-gear"></i> <span id="navSettingsLbl"></span></button>
    </div>
    <div class="nav-group">
      <div class="nav-group-title" id="ngApp"></div>
      <a class="nav-item" href="/?lang={{ lang }}" target="_blank" rel="noopener" id="sbHomeLink"><i class="fas fa-globe"></i> <span id="sbHomeLbl"></span></a>
      <button class="nav-item" id="notifyBellBtn" onclick="requestNotifyPermission()"><i class="fas fa-bell"></i> <span id="sbBellLbl"></span></button>
      <a class="nav-item" href="#" id="installAppBtn" onclick="handleInstallClick(event)" style="display:none"><i class="fas fa-download"></i> <span id="sbInstallLbl"></span></a>
      {% if config.APK_DOWNLOAD_URL and config.APK_DOWNLOAD_URL != '-' %}
      <a class="nav-item" href="{{ config.APK_DOWNLOAD_URL }}" id="apkBtn" style="display:none" download><i class="fab fa-android"></i> <span id="sbApkLbl"></span></a>
      {% endif %}
      <a class="nav-item" href="/admin/m/" id="sbMobileLink"><i class="fas fa-mobile-screen"></i> <span id="sbMobileLbl"></span></a>
      {% if config.ADMIN_APK_DOWNLOAD_URL and config.ADMIN_APK_DOWNLOAD_URL != '-' %}
      <a class="nav-item" href="{{ config.ADMIN_APK_DOWNLOAD_URL }}" download><i class="fab fa-android"></i> <span id="sbAdminApkLbl"></span></a>
      {% endif %}
    </div>
  </div>
</nav>

<div class="main">
  <header class="topbar">
    <button class="icon-btn nav-toggle" type="button" onclick="toggleSidebar()" aria-controls="sidebar" id="navToggleBtn"><i class="fas fa-bars" aria-hidden="true"></i></button>
    <h1 class="page-title" id="pageTitle"></h1>
    <div class="top-actions">
      <span class="top-clock" id="clockEl"></span>
      <button class="icon-btn" type="button" onclick="refreshAll()" id="refreshBtn"><i class="fas fa-rotate" aria-hidden="true"></i></button>
      <button class="lang-switch" type="button" onclick="toggleLang()" id="langPill"></button>
      <details class="user-menu" id="userMenu">
        <summary><span class="avatar" aria-hidden="true" id="umAvatar"></span><span class="uname" id="umName"></span><i class="fas fa-chevron-down" aria-hidden="true"></i></summary>
        <div class="menu">
          <div class="menu-head"><b id="umHeadName"></b><small id="umRole"></small></div>
          <button type="button" onclick="openPasswordModal()"><i class="fas fa-key" aria-hidden="true"></i> <span id="umPwLbl"></span></button>
          <a href="/admin/logout" class="signout"><i class="fas fa-right-from-bracket" aria-hidden="true"></i> <span id="sbLogoutLbl"></span></a>
        </div>
      </details>
    </div>
  </header>

  <div class="content">

    <!-- ── TICKETS TAB ── -->
    <div class="tab-panel active" id="tab-tickets">
      <div class="kpis" id="statCards"></div>
      <div class="card">
        <div class="filter-bar">
          <input type="search" class="search-input" id="searchBox" oninput="renderTickets()" placeholder="">
          <select class="plain" id="filterCategory" onchange="loadTickets()"></select>
          <select class="plain" id="filterAssignee" onchange="loadTickets()" style="display:none"></select>
          <select class="plain" id="filterPriority" onchange="loadTickets()"></select>
          <select class="plain" id="filterReminder" onchange="renderTickets()"></select>
          <label class="check-inline">
            <input type="checkbox" id="filterArchived" onchange="loadTickets()"> <span id="archivedLbl"></span>
          </label>
        </div>
        <div class="filter-bar" id="bulkReminderBar" style="display:none">
          <span id="bulkSelectedLbl" style="font-weight:800;font-size:.86rem"></span>
          <button class="btn btn-outline btn-sm" onclick="bulkSetReminder(true)"><i class="fas fa-bell"></i> <span id="bulkEnableLbl"></span></button>
          <button class="btn btn-outline btn-sm" onclick="bulkSetReminder(false)"><i class="fas fa-bell-slash"></i> <span id="bulkDisableLbl"></span></button>
        </div>
        <div class="table-wrap">
        <table class="tickets-table">
          <thead><tr>
            <th class="c-sel"><input type="checkbox" id="selectAllTickets" onchange="toggleSelectAll(this)"></th>
            <th onclick="sortBy('serial')" id="thSerial"></th>
            <th onclick="sortBy('teacherName')" id="thTeacher"></th>
            <th onclick="sortBy('category')" id="thCategory"></th>
            <th onclick="sortBy('subject')" id="thSubject"></th>
            <th onclick="sortBy('priority')" id="thPriority"></th>
            <th onclick="sortBy('assigneeName')" id="thAssignee"></th>
            <th onclick="sortBy('status')" id="thStatus"></th>
            <th onclick="sortBy('createdAt')" id="thDate"></th>
            <th id="thActions"></th>
          </tr></thead>
          <tbody id="ticketsBody"></tbody>
        </table>
        </div>
      </div>
    </div>

    <!-- ── CATEGORIES TAB ── -->
    <div class="tab-panel" id="tab-categories">
      <div class="card">
        <div class="card-title"><i class="fas fa-plus"></i> <span id="addCatTitle"></span></div>
        <div class="form-grid">
          <div class="form-group"><label id="lblCatAr" for="newCatAr"></label><input type="text" id="newCatAr"></div>
          <div class="form-group"><label id="lblCatEn" for="newCatEn"></label><input type="text" id="newCatEn" dir="ltr"></div>
        </div>
        <button class="btn btn-primary" onclick="addCategory()"><i class="fas fa-plus"></i> <span id="addCatBtn"></span></button>
      </div>
      <div class="card">
        <div class="card-title"><i class="fas fa-upload"></i> <span id="catUploadTitle"></span></div>
        <p class="hint" style="margin:0 0 10px" id="catUploadHint"></p>
        <input type="file" id="catFile" accept=".csv,.txt" onchange="uploadCategories(this)">
      </div>
      <div id="categoriesList"></div>
    </div>

    <!-- ── TEACHERS TAB ── -->
    <div class="tab-panel" id="tab-teachers">
      <div class="card" id="addTeacherCard">
        <div class="card-title"><i class="fas fa-chalkboard-user"></i> <span id="addTeacherTitle"></span></div>
        <div class="form-grid">
          <div class="form-group"><label id="lblTName" for="newTeacherName"></label><input type="text" id="newTeacherName"></div>
          <div class="form-group"><label id="lblTEmail" for="newTeacherEmail"></label><input type="email" id="newTeacherEmail" dir="ltr"></div>
          <div class="form-group"><label id="lblTPhone" for="newTeacherPhone"></label><input type="tel" id="newTeacherPhone" dir="ltr"></div>
        </div>
        <button class="btn btn-primary" onclick="addTeacher()"><i class="fas fa-plus"></i> <span id="addTeacherBtn"></span></button>
      </div>
      <div class="card" id="teacherUploadCard">
        <div class="card-title"><i class="fas fa-upload"></i> <span id="teachUploadTitle"></span></div>
        <p class="hint" style="margin:0 0 10px" id="teachUploadHint"></p>
        <input type="file" id="teacherFile" accept=".csv,.txt" onchange="uploadTeachers(this)">
      </div>
      <div class="card" id="teacherSasCard">
        <div class="card-title"><i class="fas fa-file-export"></i> <span id="teachSasTitle"></span></div>
        <p class="hint" style="margin:0 0 10px" id="teachSasHint"></p>
        <a class="btn btn-outline" href="/admin/api/teachers-export.csv"><i class="fas fa-download"></i> <span id="teachSasBtn"></span></a>
      </div>
      <div class="card">
        <div class="card-title"><i class="fas fa-list"></i> <span id="teacherListTitle"></span></div>
        <div class="filter-bar">
          <input type="search" class="search-input" id="teacherSearchBox" oninput="renderTeachers()" placeholder="">
          <span id="teacherSelCount" style="font-size:.84rem;color:var(--muted)"></span>
          <button class="btn btn-red btn-sm" id="teacherBulkDeleteBtn" onclick="bulkDeleteTeachers()" style="display:none">
            <i class="fas fa-trash"></i> <span id="teacherBulkDeleteLbl"></span>
          </button>
        </div>
        <div class="table-wrap">
        <table><thead><tr>
          <th style="width:34px"><input type="checkbox" id="teacherSelectAll" onchange="toggleAllTeachers(this)"></th>
          <th id="thTName"></th><th id="thTEmail"></th><th id="thTPhone"></th><th id="thTActive"></th><th id="thTActions"></th>
        </tr></thead><tbody id="teachersBody"></tbody></table>
        </div>
      </div>
    </div>

    <!-- ── STAFF TAB (Administrator only) ── -->
    <div class="tab-panel" id="tab-staff">
      <div class="card" id="addStaffCard">
        <div class="card-title"><i class="fas fa-user-plus"></i> <span id="addStaffTitle"></span></div>
        <div class="form-grid">
          <div class="form-group"><input type="text" id="newStaffUsername" dir="ltr"></div>
          <div class="form-group"><input type="text" id="newStaffFullName"></div>
          <div class="form-group"><input type="email" id="newStaffEmail" dir="ltr"></div>
          <div class="form-group"><input type="password" id="newStaffPassword"></div>
          <div class="form-group"><select id="newStaffRole"></select></div>
        </div>
        <button class="btn btn-primary" onclick="addStaff()"><i class="fas fa-plus"></i> <span id="addStaffBtn"></span></button>
        <div id="addStaffRoleExplain"></div>
      </div>
      <div class="card">
        <div class="table-wrap">
        <table><thead><tr>
          <th id="thSName"></th><th id="thSUser"></th><th id="thSRole"></th><th id="thSActive"></th><th id="thSActions"></th>
        </tr></thead><tbody id="staffBody"></tbody></table>
        </div>
      </div>
    </div>

    <!-- ── SETTINGS TAB (System Admin & Administrator) ── -->
    <div class="tab-panel" id="tab-settings">
      <div class="card">
        <div class="card-title"><i class="fas fa-building"></i> <span id="idTitle"></span></div>
        <form id="brandForm" onsubmit="saveBranding(event)">
          <div class="form-grid">
            <div class="form-group"><label for="brandOrgAr" id="idOrgArLbl"></label><input type="text" id="brandOrgAr" name="orgAr" required maxlength="200">
              <p class="hint" id="idOrgArHint"></p></div>
            <div class="form-group"><label for="brandOrgEn" id="idOrgEnLbl"></label><input type="text" id="brandOrgEn" name="orgEn" dir="ltr" maxlength="200"></div>
            <div class="form-group"><label for="brandAccent" id="idAccentLbl"></label><input type="color" id="brandAccent" name="accent">
              <p class="hint"><span id="idAccentHint"></span> <span class="mono">#0C67EC</span></p></div>
          </div>
          <div class="form-group">
            <label for="brandLogo" id="idLogoLbl"></label>
            <div class="logo-pick">
              <img id="brandLogoPreview" src="{{ brand.logo_url }}" alt="" class="{{ '' if brand.logo else 'sys-icon' }}">
              <div>
                <input type="file" id="brandLogo" name="logo" accept="image/png,image/jpeg,image/webp">
                <label class="check-inline" id="removeLogoRow" style="margin-top:8px;{{ '' if brand.logo else 'display:none' }}">
                  <input type="checkbox" id="brandRemoveLogo" name="removeLogo" value="1"> <span id="idRemoveLogoLbl"></span>
                </label>
              </div>
            </div>
            <p class="hint" id="idLogoHint"></p>
          </div>
          <button class="btn btn-primary" type="submit"><i class="fas fa-floppy-disk"></i> <span id="idSaveLbl"></span></button>
        </form>
      </div>
      <div class="card">
        <div class="card-title"><i class="fas fa-envelope"></i> <span id="mailTitle"></span></div>
        <div class="graph-status" id="graphStatus"></div>
      </div>
      <div class="card">
        <div class="card-title"><i class="fas fa-user-clock"></i> <span id="extSubTitle"></span></div>
        <p class="hint" style="margin:0 0 12px" id="extSubHint"></p>
        <label class="check-inline">
          <input type="checkbox" id="allowExternalToggle" onchange="onToggleExternal(this)">
          <span id="extSubToggleLbl"></span>
        </label>
      </div>
      <div class="card">
        <div class="card-title"><i class="fas fa-bell"></i> <span id="reminderCardTitle"></span></div>
        <p class="hint" style="margin:0 0 12px" id="reminderHint"></p>
        <div id="reminderLockedNote" class="note-box warn" style="display:none;font-weight:600"></div>
        <div id="reminderControlsWrap">
          <label class="check-inline" style="margin-bottom:12px">
            <input type="checkbox" id="reminderEnabled">
            <span id="reminderEnabledLbl"></span>
          </label>
          <div class="form-group" style="max-width:220px">
            <label id="reminderHoursLbl" for="reminderHours"></label>
            <input type="number" id="reminderHours" min="1" max="720" step="1">
          </div>
          <button class="btn btn-primary" onclick="saveReminderSettings()"><i class="fas fa-floppy-disk"></i> <span id="reminderSaveLbl"></span></button>
          <button class="btn btn-outline" onclick="checkRemindersNow()"><i class="fas fa-play"></i> <span id="reminderCheckNowLbl"></span></button>
        </div>
      </div>
    </div>

    <!-- ── REPORTS TAB (System Admin & Administrator) — staff evaluation ── -->
    <div class="tab-panel" id="tab-reports">
      <div class="card">
        <div class="card-title"><i class="fas fa-filter"></i> <span id="reportsFiltersTitle"></span></div>
        <div class="form-grid">
          <div class="form-group" style="margin:0"><label id="reportsFromLbl" for="reportsFrom"></label><input type="date" id="reportsFrom"></div>
          <div class="form-group" style="margin:0"><label id="reportsToLbl" for="reportsTo"></label><input type="date" id="reportsTo"></div>
        </div>
        <div class="filter-bar" style="margin-top:12px">
          <select class="plain" id="reportsCategory"></select>
          <select class="plain" id="reportsStatus"></select>
          <select class="plain" id="reportsPriority"></select>
        </div>
        <div class="filter-bar">
          <button class="filter-btn" onclick="setReportsQuickRange('month')" id="qrThisMonth"></button>
          <button class="filter-btn" onclick="setReportsQuickRange('lastMonth')" id="qrLastMonth"></button>
          <button class="filter-btn" onclick="setReportsQuickRange('90')" id="qrLast90"></button>
          <button class="filter-btn" onclick="setReportsQuickRange('')" id="qrAll"></button>
        </div>
        <div class="filter-bar" style="margin-bottom:0">
          <button class="btn btn-primary btn-sm" onclick="loadReports()"><i class="fas fa-rotate"></i> <span id="reportsGenerateLbl"></span></button>
          <button class="btn btn-outline btn-sm" onclick="printReports()"><i class="fas fa-print"></i> <span id="reportsPrintLbl"></span></button>
        </div>
      </div>

      <div class="kpis" id="reportsOverallCards"></div>

      <div class="card">
        <div class="card-title"><i class="fas fa-user-check"></i> <span id="reportsByStaffTitle"></span></div>
        <div id="reportsStaffList"></div>
        <div id="reportsUnassignedRow" style="margin-top:10px"></div>
      </div>
    </div>

    <!-- ── TICKER TAB (System Admin & Administrator) — scrolling marquee ── -->
    <div class="tab-panel" id="tab-ticker">
      <div class="card">
        <div class="card-title"><i class="fas fa-bullhorn"></i> <span id="tickerCardTitle"></span></div>
        <label class="check-inline" style="margin-bottom:14px">
          <input type="checkbox" id="tickerEnabled">
          <span id="tickerEnabledLbl"></span>
        </label>

        <label id="tickerContentLbl"></label>
        <div id="tickerQuill" style="background:#fff;min-height:120px"></div>
        <div class="hint" id="tickerContentHint"></div>

        <label id="tickerContentEnLbl" style="margin-top:16px"></label>
        <div id="tickerQuillEn" style="background:#fff;min-height:120px" dir="ltr"></div>
        <div class="hint" id="tickerContentEnHint"></div>

        <div class="form-grid" style="margin-top:16px">
          <div class="form-group">
            <label id="tickerSpeedLbl" for="tickerSpeed"></label>
            <input type="number" id="tickerSpeed" min="5" max="180" step="1">
            <div class="hint" id="tickerSpeedHint"></div>
          </div>
          <div class="form-group">
            <label id="tickerRssLbl" for="tickerRssUrl"></label>
            <input type="text" id="tickerRssUrl" dir="ltr" placeholder="https://example.com/feed.xml">
          </div>
          <div class="form-group">
            <label id="tickerRssColorLbl" for="tickerRssColor"></label>
            <input type="color" id="tickerRssColor">
          </div>
          <div class="form-group">
            <label id="tickerRssSizeLbl" for="tickerRssFontSize"></label>
            <input type="number" id="tickerRssFontSize" min="10" max="40" step="1">
          </div>
        </div>
        <label class="check-inline" style="margin-top:10px">
          <input type="checkbox" id="tickerRssBold">
          <span id="tickerRssBoldLbl"></span>
        </label>

        <label class="check-inline" style="margin-top:10px">
          <input type="checkbox" id="tickerLogoBetween">
          <span id="tickerLogoLbl"></span>
        </label>
        <label class="check-inline" style="margin-top:10px">
          <input type="checkbox" id="tickerPulse" onchange="document.getElementById('tickerPulseSpeedRow').style.display = this.checked ? '' : 'none'">
          <span id="tickerPulseLbl"></span>
        </label>
        <div class="form-group" id="tickerPulseSpeedRow" style="display:none;margin-top:8px;max-width:260px">
          <label id="tickerPulseSpeedLbl" for="tickerPulseSpeed"></label>
          <input type="number" id="tickerPulseSpeed" min="0.3" max="10" step="0.1">
        </div>

        <div class="form-grid" style="margin-top:14px">
          <div class="form-group">
            <label id="tickerBgColorLbl" for="tickerBgColor"></label>
            <input type="color" id="tickerBgColor" oninput="previewTickerColors()">
          </div>
          <div class="form-group">
            <label for="tickerBgOpacity"><span id="tickerBgOpacityLbl"></span> <b id="tickerBgOpacityVal">0%</b></label>
            <input type="range" id="tickerBgOpacity" min="0" max="100" step="5" style="width:100%" oninput="previewTickerColors()">
            <div class="hint" id="tickerBgOpacityHint"></div>
          </div>
          <div class="form-group">
            <label id="tickerTextColorLbl" for="tickerTextColor"></label>
            <input type="color" id="tickerTextColor" oninput="previewTickerColors()">
          </div>
        </div>

        <div class="form-group" style="margin-top:14px;max-width:260px">
          <label id="tickerShadowLbl" for="tickerShadow"></label>
          <select id="tickerShadow">
            <option value="none" id="tickerShadowNone"></option>
            <option value="light" id="tickerShadowLight"></option>
            <option value="strong" id="tickerShadowStrong"></option>
          </select>
        </div>

        <button class="btn btn-primary" style="margin-top:18px" onclick="saveTickerSettings()">
          <i class="fas fa-floppy-disk"></i> <span id="tickerSaveLbl"></span>
        </button>
        <a class="btn btn-outline" style="margin-top:18px" href="/" target="_blank">
          <i class="fas fa-eye"></i> <span id="tickerPreviewLbl"></span>
        </a>
      </div>
    </div>

  </div>
</div>

<!-- Ticket detail modal ("Open Ticket") -->
<div class="modal-overlay" id="detailModal" onclick="if(event.target===this) closeDetail()"><div class="modal" id="detailModalBody"></div></div>
<!-- Staff account edit modal -->
<div class="modal-overlay" id="staffModal" onclick="if(event.target===this) closeStaffModal()"><div class="modal" id="staffModalBody"></div></div>
<!-- Change my password -->
<div class="modal-overlay" id="pwModal" onclick="if(event.target===this) closePasswordModal()"><div class="modal narrow">
  <div class="modal-title"><span id="pwTitle"></span>
    <button class="modal-close" type="button" onclick="closePasswordModal()" id="pwCloseBtn"><i class="fas fa-xmark"></i></button></div>
  <form onsubmit="savePassword(event)">
    <div class="form-group"><label for="pwCurrent" id="pwCurrentLbl"></label>
      <div class="input-group"><i class="fas fa-lock" aria-hidden="true"></i><input type="password" id="pwCurrent" class="has-eye" autocomplete="current-password" required>
        <button type="button" class="eye" data-eye="pwCurrent"><i class="fas fa-eye" aria-hidden="true"></i></button></div></div>
    <div class="form-group"><label for="pwNew" id="pwNewLbl"></label>

function t(s) { return AR ? s : (I18N_EN[s] || s); }

async function api(url, method, body) {
  const opts = { method: method || 'GET', headers: {} };
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(url, opts);
  if (r.status === 204) return null;
  const data = await r.json().catch(() => null);
  if (!r.ok) { showToast((data && data.error) || t('حدث خطأ'), '#c0392b'); throw new Error('api error'); }
  return data;
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── Toast ──────────────────────────────────────────────────────────────
function showToast(msg, color) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = color || '#0f2a52';
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ── Clock ──────────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const opts = { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', numberingSystem: 'latn' };
  document.getElementById('clockEl').textContent = now.toLocaleString(AR ? 'ar' : 'en-US', opts);
}
setInterval(updateClock, 30000);

// ── Sidebar toggle (mobile) ──────────────────────────────────────────────
function toggleSidebar() {
  const isOpen = document.querySelector('.sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open', isOpen);
  // The ticker sits behind the dim overlay (correctly, by z-index), but a
  // scrolling animation still faintly visible through a 50%-opacity
  // overlay reads as messy/broken — just hide it outright while the menu
  // is open, on top of everything else, rather than merely dimmed.
  const ticker = document.getElementById('globalTicker');
  if (ticker) ticker.style.visibility = isOpen ? 'hidden' : '';
}
function closeSidebar() {
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
  const ticker = document.getElementById('globalTicker');
  if (ticker) ticker.style.visibility = '';
}

// User menu: closes on a click outside it or on Esc. Password fields: the show/hide eye.
document.addEventListener('click', e => {
  document.querySelectorAll('details.user-menu[open]').forEach(d => { if (!d.contains(e.target)) d.removeAttribute('open'); });
  const eye = e.target.closest('[data-eye]');
  if (eye) {
    const input = document.getElementById(eye.getAttribute('data-eye'));
    if (!input) return;
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    eye.setAttribute('aria-pressed', show ? 'true' : 'false');
    const i = eye.querySelector('i');
    if (i) { i.classList.toggle('fa-eye', !show); i.classList.toggle('fa-eye-slash', show); }
  }
});

// ── Identity: organization name under the logo, logo (or the system icon) ──
let BRAND = {{ {'orgAr': brand.org_ar, 'orgEn': brand.org_en, 'accent': brand.accent, 'logo': brand.logo, 'logoUrl': brand.logo_url}|tojson }};
let GRAPH = null;
function paintBrand() {
  const org = AR ? BRAND.orgAr : (BRAND.orgEn || BRAND.orgAr);
  const el = document.getElementById('sbOrg');
  el.textContent = org; el.title = org;
  const logo = document.getElementById('sbLogo');
  logo.src = BRAND.logoUrl;
  logo.classList.toggle('sys-icon', !BRAND.logo);
  document.documentElement.style.setProperty('--accent', BRAND.accent);
}
function fillBrandForm() {
  document.getElementById('brandOrgAr').value = BRAND.orgAr || '';
  document.getElementById('brandOrgEn').value = BRAND.orgEn || '';
  document.getElementById('brandAccent').value = BRAND.accent || '#0C67EC';
  const prev = document.getElementById('brandLogoPreview');
  prev.src = BRAND.logoUrl; prev.classList.toggle('sys-icon', !BRAND.logo);
  document.getElementById('brandLogo').value = '';
  document.getElementById('brandRemoveLogo').checked = false;
  document.getElementById('removeLogoRow').style.display = BRAND.logo ? '' : 'none';
}
async function loadBranding() {
  const b = await api('/admin/api/branding');
  BRAND = b; GRAPH = b.graph;
  fillBrandForm(); paintBrand(); renderGraphStatus();
}
function renderGraphStatus() {
  const box = document.getElementById('graphStatus');
  if (!box || !GRAPH) return;
  const badge = (on, text) => `<span class="badge ${on ? 'ok' : 'bad'}">${text}</span>`;
  box.innerHTML = `<b><i class="fas fa-paper-plane"></i> ${t('إرسال البريد الإلكتروني')}</b>
    ${badge(GRAPH.ready, GRAPH.ready ? t('جاهز') : t('غير جاهز'))}
    <span class="muted">${t('المرسل:')} <span class="mono">${esc(GRAPH.sender || '—')}</span></span>
    ${GRAPH.ready ? '' : `<p class="hint">${t('لا تُرسَل رسائل البريد حالياً. تواصل مع مسؤول تقنية المعلومات لربط حساب بريد المؤسسة.')}</p>`}`;
}
document.addEventListener('change', e => {
  if (e.target.id !== 'brandLogo' || !e.target.files || !e.target.files[0]) return;
  const prev = document.getElementById('brandLogoPreview');
  prev.src = URL.createObjectURL(e.target.files[0]); prev.classList.remove('sys-icon');
});
async function saveBranding(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  if (!document.getElementById('brandRemoveLogo').checked) fd.delete('removeLogo');
  const r = await fetch('/admin/api/branding', { method: 'POST', body: fd });
  const data = await r.json().catch(() => null);
  if (!r.ok) { showToast((data && data.error) || t('حدث خطأ'), '#dc2626'); return; }
  BRAND = data; GRAPH = data.graph;

// ── Tab navigation (with URL-hash anchors, so refresh/shared links keep the tab) ──
function showTab(name) {
  closeSidebar();
  document.getElementById('userMenu')?.removeAttribute('open');
  window.currentTab = name;
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('tab-' + name)?.classList.add('active');
  document.querySelector(`.nav-item[data-tab="${name}"]`)?.classList.add('active');
  history.replaceState(null, '', '#' + name);
  const titles = { tickets: t('التذاكر'), categories: t('التصنيفات'), teachers: t('المعلمون'), staff: t('الموظفون'), settings: t('الإعدادات'), reports: t('التقارير'), ticker: t('الشريط الإعلاني') };
  document.getElementById('pageTitle').textContent = titles[name] || name;
  if (name === 'categories') loadCategories();
  if (name === 'teachers') loadTeachers();
  if (name === 'staff') loadStaff();
  if (name === 'settings') loadSettings();
  if (name === 'reports') loadReports();
  if (name === 'ticker') loadTickerSettings();
}

// ── Reports (staff evaluation: hierarchical, filterable, printable) ───────
let REPORTS_DATA = null;
let REPORTS_OPEN_STAFF = new Set();
let REPORTS_FILTERS_POPULATED = false;

function reportsQuery() {
  const p = new URLSearchParams();
  const from = document.getElementById('reportsFrom').value;
  const to = document.getElementById('reportsTo').value;
  const cat = document.getElementById('reportsCategory').value;
  const status = document.getElementById('reportsStatus').value;
  const priority = document.getElementById('reportsPriority').value;
  if (from) p.set('from', from);
  if (to) p.set('to', to);
  if (cat) p.set('category_id', cat);
  if (status) p.set('status', status);
  if (priority) p.set('priority', priority);
  return p;
}

function setReportsQuickRange(kind) {
  const fromEl = document.getElementById('reportsFrom'), toEl = document.getElementById('reportsTo');
  const today = new Date();
  const fmt = (d) => d.toISOString().slice(0, 10);
  if (kind === 'month') {
    fromEl.value = fmt(new Date(today.getFullYear(), today.getMonth(), 1));
    toEl.value = fmt(today);
  } else if (kind === 'lastMonth') {
    fromEl.value = fmt(new Date(today.getFullYear(), today.getMonth() - 1, 1));
    toEl.value = fmt(new Date(today.getFullYear(), today.getMonth(), 0));
  } else if (kind === '90') {
    fromEl.value = fmt(new Date(today.getTime() - 90 * 86400000));
    toEl.value = fmt(today);
  } else {
    fromEl.value = ''; toEl.value = '';
  }
  loadReports();
}

function populateReportsFilterOptions() {
  const prevCat = document.getElementById('reportsCategory').value;
  const prevStatus = document.getElementById('reportsStatus').value;
  const prevPriority = document.getElementById('reportsPriority').value;
  document.getElementById('reportsCategory').innerHTML =
    `<option value="">${t('كل التصنيفات')}</option>` + (CATEGORIES || []).map(c => `<option value="${c.id}">${AR ? c.nameAr : c.nameEn}</option>`).join('');
  document.getElementById('reportsStatus').innerHTML =
    `<option value="">${t('كل الحالات')}</option><option value="open">${t('مفتوحة')}</option><option value="in_progress">${t('قيد المعالجة')}</option><option value="waiting">${t('معلقة')}</option><option value="closed">${t('مغلقة')}</option>`;
  document.getElementById('reportsPriority').innerHTML =
    `<option value="">${t('كل الأولويات')}</option><option value="low">${t('منخفضة')}</option><option value="medium">${t('متوسطة')}</option><option value="high">${t('عالية')}</option>`;
  // Rebuilding the <option> list (needed to re-translate the labels on a
  // language toggle) would otherwise silently reset whatever the admin
  // had picked back to "all" — restore the previous selection by value.
  document.getElementById('reportsCategory').value = prevCat;
  document.getElementById('reportsStatus').value = prevStatus;
  document.getElementById('reportsPriority').value = prevPriority;
  REPORTS_FILTERS_POPULATED = true;
}

async function loadReports() {
  if (!REPORTS_FILTERS_POPULATED) populateReportsFilterOptions();
  const q = reportsQuery();
  REPORTS_DATA = await api('/admin/api/reports?' + q.toString());
  renderReports();
}

function priorityLbl(p) { return { low: t('منخفضة'), medium: t('متوسطة'), high: t('عالية') }[p] || p; }

  const ar = { technical_support: 'دعم فني', system_admin: 'مدير نظام', administrator: 'مسؤول' };
  const en = { technical_support: 'Technical Support', system_admin: 'System Admin', administrator: 'Administrator' };
  return (AR ? ar : en)[r] || r;
}

function renderReports() {
  if (!REPORTS_DATA) return;
  const o = REPORTS_DATA.overall;
  const cards = [

// ── Ticker (scrolling marquee) ────────────────────────────────────────────
let tickerQuillInstance = null;
let tickerQuillEnInstance = null;

function makeTickerQuill(selector) {
  const SizeStyle = Quill.import('attributors/style/size');
  SizeStyle.whitelist = ['12px', '16px', '22px', '32px'];
  Quill.register(SizeStyle, true);
  return new Quill(selector, {
    theme: 'snow',
    modules: {
      toolbar: [
        ['bold', 'italic', 'underline'],
        [{ color: [] }, { background: [] }],
        [{ size: ['12px', '16px', '22px', '32px'] }],
        ['link'],
        ['clean'],
      ],
    },
  });
}

function getTickerQuill() {
  if (!tickerQuillInstance) tickerQuillInstance = makeTickerQuill('#tickerQuill');
  return tickerQuillInstance;
}
function getTickerQuillEn() {
  if (!tickerQuillEnInstance) tickerQuillEnInstance = makeTickerQuill('#tickerQuillEn');
  return tickerQuillEnInstance;
}

async function loadTickerSettings() {

  document.getElementById('tickerBgOpacity').value = cfg.bgOpacity || 0;

// ── TICKETS ──────────────────────────────────────────────────────────────
let TICKETS = [], CATEGORIES = [], STAFF_LIST = [];
let ticketSort = { key: 'createdAt', dir: 'desc' };

function statusLabel(s) { return AR ? ({open:'مفتوحة',in_progress:'قيد المعالجة',waiting:'معلقة',closed:'مغلقة'}[s]) : ({open:'Open',in_progress:'In Progress',waiting:'Waiting',closed:'Closed'}[s]); }
function priorityLabel(p) { return AR ? ({low:'منخفضة',medium:'متوسطة',high:'عالية'}[p]) : ({low:'Low',medium:'Medium',high:'High'}[p]); }

async function loadTickets() {
  const params = new URLSearchParams();
  const statCat = document.getElementById('filterCategory').value;
  const assignee = document.getElementById('filterAssignee').value;
  const priority = document.getElementById('filterPriority').value;
  if (statCat) params.set('category_id', statCat);
  if (assignee) params.set('assignee_id', assignee);
  if (priority) params.set('priority', priority);
  if (document.getElementById('filterArchived').checked) params.set('archived', '1');
  // Status is deliberately NOT sent to the server: the stat cards should
  // reflect the full distribution for the current scope, then status is
  // filtered client-side in renderTickets().
  TICKETS = await api('/admin/api/tickets?' + params.toString());
  document.getElementById('nbOpen').textContent = TICKETS.filter(t => t.status !== 'closed').length;
  renderStatCards();
  renderTickets();
}

function renderStatCards() {
  const all = TICKETS;
  const counts = {
    total: all.length, open: all.filter(x => x.status === 'open').length,
    in_progress: all.filter(x => x.status === 'in_progress').length,
    waiting: all.filter(x => x.status === 'waiting').length,
    closed: all.filter(x => x.status === 'closed').length,
    high: all.filter(x => x.priority === 'high').length,
    unassigned: all.filter(x => !x.assigneeId).length,
  };
  const defs = [
    ['total', 'الإجمالي', 'clear', ''], ['open', 'مفتوحة', 'open', 'warn'],
    ['in_progress', 'قيد المعالجة', 'in_progress', ''], ['waiting', 'معلقة', 'waiting', 'warn'],
    ['closed', 'مغلقة', 'closed', 'ok'],
    ['high', 'أولوية عالية', 'high_priority', 'bad'], ['unassigned', 'غير معينة', 'unassigned', 'warn'],
  ];
  const isOn = (key) => {
    if (key === 'high') return document.getElementById('filterPriority').value === 'high';
    if (key === 'unassigned') return document.getElementById('filterAssignee').value === 'unassigned';
    return window.currentStatFilter === key;
  };
  document.getElementById('statCards').innerHTML = defs.map(([key, label, action, cls]) => `
    <button type="button" class="kpi ${cls} ${isOn(key) ? 'on' : ''} ${counts[key] ? '' : 'zero'}" onclick="filterByStat('${action}')" aria-pressed="${isOn(key)}">
      <div class="n">${counts[key]}</div><div class="l">${t(label)}</div>
    </button>`).join('');
}

function filterByStat(action) {
  if (action === 'high_priority') {
    const el = document.getElementById('filterPriority');
    el.value = el.value === 'high' ? '' : 'high';
    loadTickets();
    return;
  }
  if (action === 'unassigned') {
    const el = document.getElementById('filterAssignee');
    el.value = el.value === 'unassigned' ? '' : 'unassigned';
    loadTickets();
    return;
  }
  window.currentStatFilter = (action === 'clear' || action === window.currentStatFilter) ? null : action;
  renderStatCards(); renderTickets();
}

function sortBy(key) {
  if (ticketSort.key === key) ticketSort.dir = ticketSort.dir === 'asc' ? 'desc' : 'asc';
  else { ticketSort.key = key; ticketSort.dir = 'asc'; }
  renderTickets();
}

// ── Per-ticket "has new comments" indicator ─────────────────────────────
// Tracked client-side (localStorage, keyed per staff id + ticket) rather
// than on the server: it's just "did I personally open this ticket after
// its latest comment", no new table/migration needed for it.
function visibleComments(tk) { return (tk.comments || []).filter(c => c.authorRole !== 'system'); }
function lastCommentAt(tk) {
  const cs = visibleComments(tk);
  if (!cs.length) return null;
  return cs.reduce((m, c) => (c.createdAt > m ? c.createdAt : m), cs[0].createdAt);
}
function cmtSeenKey(ticketId) { return `cmtSeen_${ME.id}_${ticketId}`; }
function hasUnseenComments(tk) {
  const last = lastCommentAt(tk);
  if (!last) return false;
  const seen = localStorage.getItem(cmtSeenKey(tk.id));
  return !seen || seen < last;
}
function markCommentsSeen(tk) {
  const last = lastCommentAt(tk);
  if (last) localStorage.setItem(cmtSeenKey(tk.id), last);
}
function commentIndicatorHtml(tk) {
  const n = visibleComments(tk).length;
  if (!n) return '';
  const unseen = hasUnseenComments(tk);
  const label = unseen ? t('تعليقات جديدة لم تُفتح بعد') : t('تعليقات');
  return `<span class="cmt-indicator ${unseen ? 'cmt-unseen' : ''}" title="${label}: ${n}"><i class="fas fa-comment-dots"></i> ${n}</span>`;
}

function renderTickets() {
  let rows = TICKETS.slice();
  if (window.currentStatFilter) rows = rows.filter(r => r.status === window.currentStatFilter);
  const reminderFilter = document.getElementById('filterReminder')?.value || '';
  if (reminderFilter === 'on') rows = rows.filter(r => r.reminderEnabled);
  else if (reminderFilter === 'off') rows = rows.filter(r => !r.reminderEnabled);
  const q = (document.getElementById('searchBox').value || '').toLowerCase();
  if (q) rows = rows.filter(r => (String(r.serial) + r.subject + r.teacherName + r.trackingCode).toLowerCase().includes(q));
  rows.sort((a, b) => {
    let av = a[ticketSort.key], bv = b[ticketSort.key];
    if (av == null) av = ''; if (bv == null) bv = '';
    if (av < bv) return ticketSort.dir === 'asc' ? -1 : 1;
    if (av > bv) return ticketSort.dir === 'asc' ? 1 : -1;
    return 0;
  });

  document.getElementById('ticketsBody').innerHTML = rows.map(tk => {
    const hoverTitle = `${AR ? 'التذكرة' : 'Ticket'} #${tk.serial} — ${esc(tk.subject)} — ${esc(tk.teacherName)} — ${esc(tk.category)}`;
    const canManage = ME.role !== 'technical_support' || tk.assigneeId === ME.id;
    const canAssign = ME.role !== 'technical_support';
    const createdParts = (tk.createdAt || '').split('T');
    const dateStr = createdParts[0] || '';
    const timeStr = (createdParts[1] || '').slice(0, 5);

    let actions = `<button class="btn btn-blue btn-sm" onclick="openDetail(${tk.id})" title="${t('عرض')}"><i class="fas fa-eye"></i></button>`;
    if (canAssign) actions += `<button class="btn btn-outline btn-sm" onclick="openDetail(${tk.id},'assign')" title="${t('تعيين')}"><i class="fas fa-user-tag"></i></button>`;
    if (canManage && (tk.status === 'open' || tk.status === 'in_progress')) {
      actions += `<button class="btn btn-outline btn-sm" onclick="doWait(${tk.id})" title="${t('معلقة')}"><i class="fas fa-hourglass-half"></i></button>`;
    }
    if (canManage && tk.status === 'waiting') {
      actions += `<button class="btn btn-blue btn-sm" onclick="doResume(${tk.id})" title="${t('استئناف')}"><i class="fas fa-play"></i></button>`;
    }
    if (tk.status !== 'closed' && canManage) actions += `<button class="btn btn-green btn-sm" onclick="openDetail(${tk.id},'close')" title="${t('إغلاق التذكرة')}"><i class="fas fa-check"></i></button>`;
    if (tk.status === 'closed' && canManage && !tk.mergedIntoId) {
      actions += `<button class="btn btn-orange btn-sm" onclick="doReopen(${tk.id})" title="${t('إعادة فتح')}"><i class="fas fa-undo"></i></button>`;
      if (!tk.archived) actions += `<button class="btn btn-outline btn-sm" onclick="doArchive(${tk.id})" title="${t('أرشفة')}"><i class="fas fa-box-archive"></i></button>`;
    }
    actions += `<a class="btn btn-outline btn-sm" href="/admin/ticket/${tk.id}/print" target="_blank" title="${t('طباعة')}"><i class="fas fa-print"></i></a>`;
    if (canManage && tk.status !== 'closed') actions += `<button class="btn btn-outline btn-sm" onclick="promptMerge(${tk.id})" title="${t('دمج')}"><i class="fas fa-code-merge"></i></button>`;

    return `<tr title="${hoverTitle}" class="row-status row-status-${tk.status}">
      <td><input type="checkbox" class="ticketSelectBox" data-id="${tk.id}" onchange="onTicketSelectChange()" ${SELECTED_TICKETS.has(tk.id) ? 'checked' : ''}></td>
      <td data-label="${t('الرقم')}"><strong style="color:var(--primary)">#${tk.serial}</strong>${tk.mergedIntoId ? ` <span class="badge" style="background:#eee;color:#888">${t('مدمجة')}</span>` : ''}${tk.reminderEnabled ? ` <i class="fas fa-bell" style="color:#e67e22" title="${t('التذكير مفعّل لهذه التذكرة')}"></i>` : ''}${commentIndicatorHtml(tk)}</td>
      <td data-label="${t('المعلم')}" class="c-trunc" title="${esc(tk.teacherName)}">${esc(tk.teacherName)}</td>
      <td data-label="${t('التصنيف')}" class="c-trunc" title="${esc(tk.category)}${tk.categoryItem ? ' / ' + esc(tk.categoryItem) : ''}">${esc(tk.category)}${tk.categoryItem ? ' / ' + esc(tk.categoryItem) : ''}</td>
      <td data-label="${t('الموضوع')}" class="c-trunc" dir="auto" title="${esc(tk.subject)}">${esc(tk.subject)}</td>
      <td data-label="${t('الأولوية')}"><span class="priority-${tk.priority}"><span class="priority-dot"></span>${priorityLabel(tk.priority)}</span></td>
      <td data-label="${t('الموظف المسؤول')}" class="c-trunc" title="${esc(tk.assigneeName || (AR ? 'غير معيّن' : 'Unassigned'))}">${esc(tk.assigneeName || (AR ? 'غير معيّن' : 'Unassigned'))}</td>
      <td data-label="${t('الحالة')}"><span class="badge badge-${tk.status}">${statusLabel(tk.status)}</span></td>
      <td data-label="${t('التاريخ والوقت')}" class="c-dt"><span class="dt-d">${dateStr}</span><small class="dt-t">${timeStr}</small></td>
      <td data-label="${t('إجراءات')}"><div class="row-actions">${actions}</div></td>
    </tr>`;
  }).join('') || `<tr><td colspan="10" style="text-align:center;color:var(--muted);padding:20px">${t('لا توجد نتائج')}</td></tr>`;
  // icon-only buttons: the tooltip doubles as the accessible name
  document.querySelectorAll('#ticketsBody .row-actions .btn[title]').forEach(b => b.setAttribute('aria-label', b.title));
  updateBulkReminderBar();
}

// ── Multi-select for the per-ticket auto-reminder opt-in ───────────────────
const SELECTED_TICKETS = new Set();
function onTicketSelectChange() {
  document.querySelectorAll('.ticketSelectBox').forEach(cb => {
    const id = parseInt(cb.dataset.id, 10);
    if (cb.checked) SELECTED_TICKETS.add(id); else SELECTED_TICKETS.delete(id);
  });
  updateBulkReminderBar();
}
function toggleSelectAll(el) {
  document.querySelectorAll('.ticketSelectBox').forEach(cb => { cb.checked = el.checked; });
  onTicketSelectChange();
}
function updateBulkReminderBar() {
  const bar = document.getElementById('bulkReminderBar');
  const lbl = document.getElementById('bulkSelectedLbl');
  if (!bar || !lbl) return;
  if (SELECTED_TICKETS.size > 0) {
    bar.style.display = 'flex';
    lbl.textContent = `${SELECTED_TICKETS.size} ${t('تذكرة محددة')}`;
  } else {
    bar.style.display = 'none';
  }
}
async function bulkSetReminder(enabled) {
  const ids = [...SELECTED_TICKETS];
  if (!ids.length) return;
  const msg = enabled ? t('هل تريد تفعيل التذكير التلقائي لهذه التذاكر؟') : t('هل تريد إلغاء التذكير التلقائي لهذه التذاكر؟');
  if (!confirm(msg)) return;
  await api('/admin/api/tickets/reminder-toggle', 'POST', { ticketIds: ids, enabled });
  showToast(t('تم التحديث'));
  SELECTED_TICKETS.clear();
  loadTickets();
}

// ── Ticket detail modal ("Open Ticket") ──────────────────────────────────
async function openDetail(id, focus) {
  const tk = await api('/admin/api/tickets/' + id);

  // Opening the ticket is what "reading its comments" means here — mark
  // them seen and refresh the list in the background so that ticket's 💬
  // stops pulsing immediately, without waiting for the next full reload.
  markCommentsSeen(tk);
  const idx = TICKETS.findIndex(x => x.id === tk.id);
  if (idx !== -1) TICKETS[idx] = tk; else TICKETS.push(tk);
  renderTickets();

  const canManage = ME.role !== 'technical_support' || tk.assigneeId === ME.id;
  const canAssign = ME.role !== 'technical_support';

  const commentsHtml = tk.comments.filter(c => c.authorRole !== 'system').map(c => `
    <div class="comment ${c.internal ? 'internal' : ''}">

    </div>
    ${tk.description ? `<div style="margin:10px 0;background:#fff4dc;border-inline-start:5px solid #e0a100;border-radius:8px;padding:10px 14px"><div class="k" style="color:#8a5a00;font-size:.75rem;font-weight:700;margin-bottom:4px"><i class="fas fa-sticky-note"></i> ${t('وصف المشكلة من مقدّم الطلب')}</div><div dir="auto" style="white-space:pre-wrap;font-size:1rem;font-weight:600;color:#1a1a1a;line-height:1.7">${esc(tk.description)}</div></div>` : ''}

function closeDetail() { document.getElementById('detailModal').classList.remove('open'); }

// Any open popup/modal in the dashboard closes on Escape — matches the
// click-outside-to-close behavior wired onto each .modal-overlay above.
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  document.getElementById('detailModal')?.classList.remove('open');
  document.getElementById('staffModal')?.classList.remove('open');
  document.getElementById('pwModal')?.classList.remove('open');
  document.querySelectorAll('details.user-menu[open]').forEach(d => d.removeAttribute('open'));
  closeSidebar();
});

async function doAssign(id) {
  const val = document.getElementById('assigneeSelect').value;
  await api(`/admin/api/tickets/${id}/assign`, 'POST', { assigneeId: val ? parseInt(val, 10) : null });
  showToast(t('تم التحديث'));
  await loadTickets();
  openDetail(id);
}

async function doComment(id) {
  const body = document.getElementById('newCommentBody').value.trim();
  if (!body) { showToast(t('يرجى كتابة تعليق'), '#c0392b'); return; }
  const internal = document.getElementById('newCommentInternal').checked;
  await api(`/admin/api/tickets/${id}/comment`, 'POST', { body, internal });
  await loadTickets();
  openDetail(id);
}

function promptClose(id) {
  if (!confirm(t('هل تريد إغلاق هذه التذكرة؟'))) return;
  const note = prompt(t('تعليق الإغلاق (اختياري)') + ':') || '';
  if (note === null) return;
  api(`/admin/api/tickets/${id}/close`, 'POST', { comment: note }).then(() => { showToast(t('تم التحديث')); loadTickets(); closeDetail(); });
}

async function doReopen(id) { if (!confirm(t('هل تريد إعادة فتح هذه التذكرة؟'))) return; await api(`/admin/api/tickets/${id}/reopen`, 'POST'); showToast(t('تم التحديث')); loadTickets(); closeDetail(); }
async function doArchive(id) { if (!confirm(t('هل تريد أرشفة هذه التذكرة؟'))) return; await api(`/admin/api/tickets/${id}/archive`, 'POST'); showToast(t('تم التحديث')); loadTickets(); closeDetail(); }
async function doWait(id) { await api(`/admin/api/tickets/${id}/wait`, 'POST'); showToast(t('تم التحديث')); loadTickets(); }
async function doResume(id) { await api(`/admin/api/tickets/${id}/resume`, 'POST'); showToast(t('تم التحديث')); loadTickets(); }
async function doSetPriority(id) {
  const priority = document.getElementById('prioritySelect').value;
  await api(`/admin/api/tickets/${id}/priority`, 'POST', { priority });
  showToast(t('تم التحديث'));
  await loadTickets();
  openDetail(id);
}

function promptMerge(id) {
  const other = prompt(t('أدخل الرقم التسلسلي للتذكرة الأخرى للدمج معها:'));
  if (!other) return;
  const otherTicket = TICKETS.find(x => String(x.serial) === String(other).trim());
  if (!otherTicket) { showToast(t('حدث خطأ'), '#c0392b'); return; }
  if (!confirm(t('هل تريد دمج هاتين التذكرتين؟ لا يمكن التراجع عن هذا الإجراء.'))) return;
  api('/admin/api/tickets/merge', 'POST', { ticketIdA: id, ticketIdB: otherTicket.id })
    .then(() => { showToast(t('تم التحديث')); loadTickets(); closeDetail(); });
}

async function addCategory() {
  const nameAr = document.getElementById('newCatAr').value.trim();
  const nameEn = document.getElementById('newCatEn').value.trim();
  if (!nameAr) return;
  await api('/admin/api/categories', 'POST', { nameAr, nameEn });
  document.getElementById('newCatAr').value = ''; document.getElementById('newCatEn').value = '';
  showToast(t('تمت الإضافة'));
  loadCategories();
}
async function toggleCategoryActive(id, active) { await api(`/admin/api/categories/${id}`, 'PUT', { active }); loadCategories(); }
async function deleteCategory(id) { if (!confirm(t('هل أنت متأكد من حذف هذا التصنيف؟'))) return; await api(`/admin/api/categories/${id}`, 'DELETE'); loadCategories(); }
async function addCategoryItem(catId) {
  const nameAr = document.getElementById(`itemAr-${catId}`).value.trim();
  const nameEn = document.getElementById(`itemEn-${catId}`).value.trim();
  const code = document.getElementById(`itemCode-${catId}`).value.trim();
  const codeEn = document.getElementById(`itemCodeEn-${catId}`).value.trim();
  if (!nameAr) return;
  await api(`/admin/api/categories/${catId}/items`, 'POST', { nameAr, nameEn, code, codeEn });

async function deleteCategoryItem(id) { if (!confirm(t('هل أنت متأكد من حذف هذا العنصر؟'))) return; await api(`/admin/api/category-items/${id}`, 'DELETE'); loadCategories(); }

function parseCsvLines(text, fields) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const parts = l.split(',').map(p => p.trim());
    const obj = {};
    fields.forEach((f, i) => obj[f] = parts[i] || '');
    return obj;
  });
}

async function uploadCategories(input) {
  const file = input.files[0];
  if (!file) return;
  const list = parseCsvLines(await file.text(), ['nameAr', 'nameEn']).filter(x => x.nameAr);
  const data = await api('/admin/api/bulk-add-categories', 'POST', { list });
  let msg = `${t('تمت الإضافة')}: ${data.count}`;
  if (data.errors && data.errors.length) msg += ` — ${t('تعذّر')}: ${data.errors.length}`;
  showToast(msg, data.errors && data.errors.length ? '#e67e22' : '#27ae60');
  loadCategories();
  input.value = '';
}

async function uploadCategoryItems(catId, input) {
  const file = input.files[0];
  if (!file) return;
  const list = parseCsvLines(await file.text(), ['nameAr', 'nameEn', 'code', 'codeEn']).filter(x => x.nameAr);
  const data = await api(`/admin/api/categories/${catId}/bulk-add-items`, 'POST', { list });
  let msg = `${t('تمت الإضافة')}: ${data.count}`;
  if (data.errors && data.errors.length) msg += ` — ${t('تعذّر')}: ${data.errors.length}`;
  showToast(msg, data.errors && data.errors.length ? '#e67e22' : '#27ae60');
  loadCategories();
  input.value = '';
}

let TEACHERS = [];
let editingTeacherId = null;
let selectedTeacherIds = new Set();

async function loadTeachers() { TEACHERS = await api('/admin/api/teachers'); selectedTeacherIds.clear(); editingTeacherId = null; renderTeachers(); }

function renderTeachers() {
  const canManage = ME.role !== 'technical_support';
  const q = (document.getElementById('teacherSearchBox').value || '').toLowerCase();
  const rows = q
    ? TEACHERS.filter(tc => (tc.name + ' ' + (tc.email||'') + ' ' + (tc.phone||'')).toLowerCase().includes(q))
    : TEACHERS;

  document.getElementById('teachersBody').innerHTML = rows.map(tc => {
    if (editingTeacherId === tc.id) {
      return `<tr>
        <td></td>
        <td data-label="${t('الاسم')}"><input type="text" id="editTName" value="${esc(tc.name)}" style="min-width:120px"></td>
        <td data-label="${t('البريد الإلكتروني')}"><input type="email" id="editTEmail" dir="ltr" value="${esc(tc.email || '')}" style="min-width:140px"></td>
        <td data-label="${t('الجوال')}"><input type="tel" id="editTPhone" dir="ltr" value="${esc(tc.phone || '')}" style="min-width:110px"></td>
        <td data-label="${t('مفعّل')}">${tc.active ? '<i class="fas fa-check" style="color:#27ae60"></i>' : '<i class="fas fa-times" style="color:#c0392b"></i>'}</td>
        <td data-label="${t('إجراءات')}">
          <button class="btn btn-primary btn-sm" onclick="saveEditTeacher(${tc.id})" title="${t('حفظ')}"><i class="fas fa-check"></i></button>
          <button class="btn btn-outline btn-sm" onclick="cancelEditTeacher()" title="${t('إلغاء')}"><i class="fas fa-times"></i></button>
        </td>
      </tr>`;
    }
    return `<tr>
      <td><input type="checkbox" class="teacher-check" value="${tc.id}" ${selectedTeacherIds.has(tc.id) ? 'checked' : ''} onchange="onTeacherCheck(${tc.id}, this.checked)"></td>
      <td data-label="${t('الاسم')}">${esc(tc.name)}</td>
      <td data-label="${t('البريد الإلكتروني')}">${esc(tc.email || '—')}</td>
      <td data-label="${t('الجوال')}">${esc(tc.phone || '—')}</td>
      <td data-label="${t('مفعّل')}">${tc.active ? '<i class="fas fa-check" style="color:#27ae60"></i>' : '<i class="fas fa-times" style="color:#c0392b"></i>'}</td>
      <td data-label="${t('إجراءات')}">${canManage ? `
        <button class="btn btn-blue btn-sm" onclick="startEditTeacher(${tc.id})" title="${t('تعديل')}"><i class="fas fa-pen"></i></button>
        <button class="btn btn-outline btn-sm" onclick="toggleTeacherActive(${tc.id}, ${!tc.active})" title="${tc.active ? t('غير نشط') : t('نشط')}"><i class="fas fa-power-off"></i></button>
        <button class="btn btn-red btn-sm" onclick="deleteTeacher(${tc.id})" title="${t('حذف')}"><i class="fas fa-trash"></i></button>` : ''}
      </td>
    </tr>`;
  }).join('') || `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:16px">${t('لا توجد نتائج')}</td></tr>`;

  document.getElementById('teacherSelectAll').checked = rows.length > 0 && rows.every(tc => selectedTeacherIds.has(tc.id));
  updateTeacherSelCount();
}

function onTeacherCheck(id, checked) {
  if (checked) selectedTeacherIds.add(id); else selectedTeacherIds.delete(id);
  updateTeacherSelCount();
}

function toggleAllTeachers(el) {
  const q = (document.getElementById('teacherSearchBox').value || '').toLowerCase();
  const rows = q
    ? TEACHERS.filter(tc => (tc.name + ' ' + (tc.email||'') + ' ' + (tc.phone||'')).toLowerCase().includes(q))
    : TEACHERS;
  rows.forEach(tc => { if (el.checked) selectedTeacherIds.add(tc.id); else selectedTeacherIds.delete(tc.id); });
  renderTeachers();
}

function updateTeacherSelCount() {
  const n = selectedTeacherIds.size;
  document.getElementById('teacherSelCount').textContent = n ? `${t('محدد')}: ${n}` : '';
  document.getElementById('teacherBulkDeleteBtn').style.display = n ? '' : 'none';
}

async function bulkDeleteTeachers() {
  const ids = [...selectedTeacherIds];
  if (!ids.length) return;
  if (!confirm(AR ? `هل أنت متأكد من حذف ${ids.length} معلم/ة؟` : `Delete ${ids.length} teacher(s)?`)) return;
  for (const id of ids) {
    try { await api(`/admin/api/teachers/${id}`, 'DELETE'); } catch (e) { /* keep going */ }
  }
  showToast(t('تم التحديث'));
  loadTeachers();
}

function startEditTeacher(id) { editingTeacherId = id; renderTeachers(); }
function cancelEditTeacher() { editingTeacherId = null; renderTeachers(); }
async function saveEditTeacher(id) {
  const name = document.getElementById('editTName').value.trim();
  if (!name) return;
  await api(`/admin/api/teachers/${id}`, 'PUT', {
    name, email: document.getElementById('editTEmail').value.trim(),
    phone: document.getElementById('editTPhone').value.trim(),

  showToast(t('تم التحديث'));
  loadTeachers();
}

async function addTeacher() {
  const name = document.getElementById('newTeacherName').value.trim();
  if (!name) return;
  await api('/admin/api/teachers', 'POST', {
    name, email: document.getElementById('newTeacherEmail').value.trim(),

  document.getElementById('newTeacherEmail').value = '';
  document.getElementById('newTeacherPhone').value = '';

  loadTeachers();
}
async function toggleTeacherActive(id, active) { await api(`/admin/api/teachers/${id}`, 'PUT', { active }); loadTeachers(); }
async function deleteTeacher(id) { if (!confirm(t('هل أنت متأكد من حذف هذا المعلم؟'))) return; await api(`/admin/api/teachers/${id}`, 'DELETE'); loadTeachers(); }

async function uploadTeachers(input) {
  const file = input.files[0];
  if (!file) return;
  const list = parseCsvLines(await file.text(), ['name', 'email', 'phone']).filter(x => x.name);
  const data = await api('/admin/api/bulk-add-teachers', 'POST', { list });

  if (data.errors && data.errors.length) msg += ` — ${t('تعذّر')}: ${data.errors.length}`;

  document.getElementById('staffBody').innerHTML = STAFF_LIST.map(s => `

}
async function addStaff() {
  const username = document.getElementById('newStaffUsername').value.trim();
  const fullName = document.getElementById('newStaffFullName').value.trim();
  const password = document.getElementById('newStaffPassword').value;
  const email = document.getElementById('newStaffEmail').value.trim();

}

async function deleteStaff(id) { if (!confirm(t('هل أنت متأكد من تعطيل هذا الحساب؟'))) return; await api(`/admin/api/staff/${id}`, 'DELETE'); loadStaff(); }

function closeStaffModal() { document.getElementById('staffModal').classList.remove('open'); }

async function saveStaffEdit(id) {
  const fullName = document.getElementById('editStaffFullName').value.trim();
  const email = document.getElementById('editStaffEmail').value.trim();
  const password = document.getElementById('editStaffPassword').value;
  const role = document.getElementById('editStaffRole').value;
  const canChangePriority = document.getElementById('editStaffCanPriority').checked;
  const canManageReminders = document.getElementById('editStaffCanReminders').checked;
  const body = { fullName, email, role, canChangePriority, canManageReminders };
  if (password) body.password = password;

  showToast(t('تم التحديث'));
  closeStaffModal();
  loadStaff();

// ── PWA install + service worker ─────────────────────────────────────────
let deferredInstallPrompt = null;
const installBtn = document.getElementById('installAppBtn');
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
if (!isStandalone) {
  if (isIOS) { installBtn.style.display = 'flex'; }
  else window.addEventListener('beforeinstallprompt', e => { deferredInstallPrompt = e; installBtn.style.display = 'flex'; });
}
function handleInstallClick(e) {
  e.preventDefault();
  if (isIOS) { alert(AR ? 'لإضافة التطبيق للشاشة الرئيسية اضغط زر المشاركة ثم Add to Home Screen' : 'Tap Share, then "Add to Home Screen"'); return; }
  if (deferredInstallPrompt) { deferredInstallPrompt.prompt(); deferredInstallPrompt.userChoice.finally(() => { deferredInstallPrompt = null; installBtn.style.display = 'none'; }); }
}
window.addEventListener('appinstalled', () => installBtn.style.display = 'none');

// ── Web Push notifications (bell button) ─────────────────────────────────
async function subscribeToPush() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const { key } = await api('/admin/api/vapid-public-key');
    if (!key) return false;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(key) });
    await api('/admin/api/push-subscribe', 'POST', sub.toJSON());
    return true;
  } catch (e) { console.error(e); return false; }
}
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
async function requestNotifyPermission() {
  if (!window.Notification) { showToast(t('المتصفح لا يدعم الإشعارات'), '#c0392b'); return; }
  try {
    const perm = await Notification.requestPermission();
    const btn = document.getElementById('notifyBellBtn');
    if (perm === 'granted') {
      const pushOk = await subscribeToPush();
      showToast(pushOk ? t('تم تفعيل الإشعارات — ستصلك حتى لو أغلقت التطبيق ✓') : t('تم تفعيل الإشعارات بالتطبيق المفتوح ✓'), '#27ae60');
      if (btn) btn.classList.add('on-state');
    } else {
      showToast(t('لم يتم منح إذن الإشعارات'), '#c0392b');
    }
  } catch (e) { console.error(e); }
}

// ── Init ──────────────────────────────────────────────────────────────────
(async function init() {
  document.documentElement.lang = AR ? 'ar' : 'en';
  document.documentElement.dir = AR ? 'rtl' : 'ltr';
  paintStaticLabels();
  updateClock();
  await loadFilterOptions();
  await loadTickets();

  const validTabs = ['tickets', 'categories', 'teachers', 'staff', 'settings', 'reports', 'ticker'];
  const initialTab = location.hash.replace('#', '');
  if (validTabs.includes(initialTab)) showTab(initialTab);

  // Deep link from a staff notification email action button
  // (?ticket=<id>&focus=assign|close) — opens straight to that ticket,
  // already focused on the relevant action, same as clicking its row.
  // Nothing is executed automatically; the person still confirms in the UI.
  const dl = new URLSearchParams(location.search);
  const dlTicket = dl.get('ticket');
  if (dlTicket && TICKETS.some(x => String(x.id) === String(dlTicket))) {
    openDetail(parseInt(dlTicket, 10), dl.get('focus') || undefined);
    history.replaceState({}, '', location.pathname + location.hash);
  }

  if (window.Notification && Notification.permission === 'granted') {
    document.getElementById('notifyBellBtn')?.classList.add('on-state');
  }
  setInterval(loadTickets, 60000);
})();
</script>

<!-- ===== لوحة البحث السريع للتنقّل (Ctrl+K) — مكوّن مستقل ===== -->
<script>
(function(){
  if (window.__cmdkReady) return; window.__cmdkReady = true;
  var cfg = window.__CMDK_CONFIG || {};
  var SEL = cfg.sel || '.sidebar .nav-item, .sidebar-nav .nav-item, #nav-sidebar a';

  // --- حقن الأنماط (يتكيّف مع الوضع الداكن) ---
  var css = ''
    + '.cmdk-ov{position:fixed;inset:0;z-index:99999;display:none;align-items:flex-start;justify-content:center;background:rgba(0,0,0,.45);padding-top:12vh;backdrop-filter:blur(2px)}'
    + '.cmdk-ov.open{display:flex}'
    + '.cmdk-box{width:min(620px,92vw);background:#fff;color:#1a2b2e;border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.35);overflow:hidden;font-family:inherit;border:1px solid rgba(0,0,0,.08)}'
    + '.cmdk-ih{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(0,0,0,.08)}'
    + '.cmdk-ih i{opacity:.55;font-size:16px}'
    + '.cmdk-ih input{flex:1;border:0;outline:0;background:transparent;font-size:16px;color:inherit;font-family:inherit}'
    + '.cmdk-kbd{font-size:11px;opacity:.6;border:1px solid rgba(0,0,0,.2);border-radius:6px;padding:1px 6px;white-space:nowrap}'
    + '.cmdk-list{max-height:52vh;overflow:auto;padding:6px}'
    + '.cmdk-it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;cursor:pointer}'
    + '.cmdk-it i{width:20px;text-align:center;opacity:.8}'
    + '.cmdk-it .cmdk-lbl{flex:1;font-size:14.5px}'
    + '.cmdk-it .cmdk-grp{font-size:11.5px;opacity:.55}'
    + '.cmdk-it.sel,.cmdk-it:hover{background:rgba(12,103,236,.12)}'
    + '.cmdk-empty{padding:22px;text-align:center;opacity:.6;font-size:14px}'
    + '@media (prefers-color-scheme:dark){.cmdk-box{background:#13201f;color:#e7eef0;border-color:rgba(255,255,255,.1)}.cmdk-ih,.cmdk-it.sel,.cmdk-it:hover{border-color:rgba(255,255,255,.1)}.cmdk-it.sel,.cmdk-it:hover{background:rgba(255,255,255,.08)}.cmdk-kbd{border-color:rgba(255,255,255,.25)}}'
    + ':root[data-theme="dark"] .cmdk-box{background:#13201f;color:#e7eef0;border-color:rgba(255,255,255,.1)}'
    + ':root[data-theme="dark"] .cmdk-ih{border-color:rgba(255,255,255,.1)}'
    + ':root[data-theme="dark"] .cmdk-it.sel,:root[data-theme="dark"] .cmdk-it:hover{background:rgba(255,255,255,.08)}'
    + ':root[data-theme="dark"] .cmdk-kbd{border-color:rgba(255,255,255,.25)}';
  var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

  // --- بناء الواجهة ---
  var ov = document.createElement('div'); ov.className = 'cmdk-ov';
  ov.innerHTML =
    '<div class="cmdk-box" role="dialog" aria-label="بحث سريع">'
    + '<div class="cmdk-ih"><i class="fas fa-magnifying-glass"></i>'
    + '<input type="text" id="cmdkInput" placeholder="اكتب اسم القائمة أو الصفحة…" autocomplete="off" spellcheck="false">'
    + '<span class="cmdk-kbd">Esc</span></div>'
    + '<div class="cmdk-list" id="cmdkList"></div></div>';
  document.body.appendChild(ov);
  var input = ov.querySelector('#cmdkInput');
  var list  = ov.querySelector('#cmdkList');
  var items = [], view = [], idx = 0;

  function norm(s){ return (s||'').toString().toLowerCase()
      .replace(/[ً-ٰٟ]/g,'').replace(/[أإآ]/g,'ا')
      .replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[‌-‏]/g,'')
      .replace(/\s+/g,' ').trim(); }

  function collect(){
    var els = Array.prototype.slice.call(document.querySelectorAll(SEL)), out = [], seen = {};
    els.forEach(function(el){
      if (el.style.display === 'none' || el.hasAttribute('hidden') || el.getAttribute('aria-hidden') === 'true') return;
      var lbl = (el.getAttribute('data-cmdk-label') || el.textContent || '').replace(/\s+/g,' ').trim();
      lbl = lbl.replace(/\s+\d+$/,'').trim();
      if (!lbl) return;
      var ic = el.querySelector('i'); var icon = ic ? ic.className : 'fas fa-chevron-left';
      var g = el.closest('.nav-group'); var gt = g ? g.querySelector('.nav-group-title') : null;
      var grp = gt ? gt.textContent.replace(/\s+/g,' ').trim() : '';
      var key = grp + '|' + lbl; if (seen[key]) return; seen[key] = 1;
      out.push({ el: el, label: lbl, icon: icon, group: grp, n: norm(lbl + ' ' + grp) });
    });
    return out;
  }

  function render(){
    list.innerHTML = '';
    if (!view.length){ list.innerHTML = '<div class="cmdk-empty">لا نتائج</div>'; return; }
    view.forEach(function(o, i){
      var d = document.createElement('div');
      d.className = 'cmdk-it' + (i === idx ? ' sel' : '');
      d.innerHTML = '<i class="' + o.icon + '"></i><span class="cmdk-lbl"></span>'
                  + (o.group ? '<span class="cmdk-grp"></span>' : '');
      d.querySelector('.cmdk-lbl').textContent = o.label;
      if (o.group) d.querySelector('.cmdk-grp').textContent = o.group;
      d.addEventListener('mouseenter', function(){ idx = i; markSel(); });
      d.addEventListener('click', function(){ activate(o); });
      list.appendChild(d);
    });
  }
  function markSel(){
    var ch = list.children;
    for (var i=0;i<ch.length;i++) ch[i].classList.toggle('sel', i===idx);
    if (ch[idx]) ch[idx].scrollIntoView({ block:'nearest' });
  }
  function filter(){
    var q = norm(input.value);
    if (!q){ view = items.slice(0, 50); }
    else {
      var toks = q.split(' ');
      view = items.filter(function(o){ return toks.every(function(t){ return o.n.indexOf(t) !== -1; }); });
    }
    idx = 0; render();
  }
  function activate(o){
    close();
    var el = o.el, href = el.getAttribute && el.getAttribute('href');
    if (el.tagName === 'A' && href && href !== '#') window.location.href = el.href;
    else el.click();
  }
  function open(){
    items = collect(); input.value = ''; filter();
    ov.classList.add('open');
    setTimeout(function(){ input.focus(); }, 20);
  }
  function close(){ ov.classList.remove('open'); }
  window.__cmdkOpen = open;

  input.addEventListener('input', filter);
  input.addEventListener('keydown', function(e){
    if (e.key === 'ArrowDown'){ e.preventDefault(); idx = Math.min(idx+1, view.length-1); markSel(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); idx = Math.max(idx-1, 0); markSel(); }
    else if (e.key === 'Enter'){ e.preventDefault(); if (view[idx]) activate(view[idx]); }
    else if (e.key === 'Escape'){ e.preventDefault(); close(); }
  });
  ov.addEventListener('click', function(e){ if (e.target === ov) close(); });

  document.addEventListener('keydown', function(e){
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')){
      e.preventDefault(); ov.classList.contains('open') ? close() : open();
    }
  });
})();
</script>
