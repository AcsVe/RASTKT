<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ 'لوحة تحكم تذاكر الدعم الفني' if lang == 'ar' else 'IT Support Ticketing — Control Panel' }}</title>

<link rel="manifest" href="/static/manifest-admin.json">
<meta name="theme-color" content="#1B3358">
<link rel="icon" href="/static/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{ 'إدارة التذاكر' if lang == 'ar' else 'Ticket Admin' }}">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #247680; --primary-dark: #1a5860; --secondary: #1B3358;
  --bg: #eef3f5; --white: #fff; --text: #1e2a2b; --muted: #6b7c7e; --border: #dde8ea;
  --green: #27ae60; --red: #c0392b; --orange: #e67e22; --blue: #1a5fb4;
  --radius: 12px; --shadow: 0 2px 14px rgba(0,0,0,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14.5px; }
body { font-family: {% if lang == 'ar' %}'Tajawal'{% else %}'Inter'{% endif %}, sans-serif; background: var(--bg); color: var(--text); }
a { color: inherit; }
.topbar {
  background: linear-gradient(135deg, var(--secondary), #2E4E7A); color: #fff; padding: 10px 18px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; box-shadow: 0 2px 10px rgba(0,0,0,.2);
  position: sticky; top: 0; z-index: 200;
}
.topbar img { height: 36px; border-radius: 6px; background: #fff; padding: 2px; }
.topbar-title { font-weight: 800; font-size: 1rem; flex: 1; min-width: 160px; }
.topbar .staff-chip { background: rgba(255,255,255,.14); border-radius: 20px; padding: 6px 14px; font-size: .8rem; font-weight: 700; }
.topbar button, .topbar a.tb-btn {
  background: rgba(255,255,255,.12); border: none; color: #fff; padding: 8px 12px; border-radius: 8px;
  font-size: .8rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.topbar button:hover, .topbar a.tb-btn:hover { background: rgba(255,255,255,.26); }

.tabs { display: flex; gap: 4px; background: #fff; padding: 8px 14px 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab-btn {
  background: none; border: none; padding: 10px 16px; font-family: inherit; font-size: .85rem; font-weight: 700;
  color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap;
}
.tab-btn.active { color: var(--primary-dark); border-bottom-color: var(--primary); }

.wrap { padding: 16px; max-width: 1400px; margin: 0 auto; }
.stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 14px; }
.stat-card { background: #fff; border-radius: var(--radius); padding: 12px; text-align: center; box-shadow: var(--shadow); cursor: pointer; border: 2px solid transparent; }
.stat-card.on { border-color: var(--primary); }
.stat-val { font-size: 1.4rem; font-weight: 800; color: var(--primary-dark); }
.stat-label { font-size: .72rem; color: var(--muted); font-weight: 700; }

.toolbar { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar select, .toolbar input[type=search] { padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 8px; font-family: inherit; font-size: .82rem; }
.toolbar input[type=search] { flex: 1; min-width: 160px; }

table { width: 100%; border-collapse: collapse; background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
th, td { padding: 9px 10px; font-size: .82rem; text-align: start; border-bottom: 1px solid var(--border); }
th { background: #f5f9fa; color: var(--muted); font-weight: 800; cursor: pointer; user-select: none; white-space: nowrap; }
tbody tr:hover { background: #f7fbfb; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 14px; font-size: .72rem; font-weight: 800; white-space: nowrap; }
.badge-open { background: #fef2e0; color: #b9770e; }
.badge-in_progress { background: #e3f0ff; color: var(--blue); }
.badge-closed { background: #eaf7ee; color: var(--green); }
.badge-role { background: #eef3f5; color: var(--primary-dark); }
.urgent-flag { color: var(--red); font-weight: 800; }

.btn { border: none; border-radius: 7px; padding: 6px 9px; font-size: .8rem; cursor: pointer; margin-inline-end: 3px; }
.btn-blue { background: #e3f0ff; color: var(--blue); }
.btn-green { background: #eafaf0; color: var(--green); }
.btn-red { background: #fdeceb; color: var(--red); }
.btn-orange { background: #fdf1e3; color: var(--orange); }
.btn-outline { background: #f1f5f5; color: var(--text); }
.btn-primary { background: var(--primary); color: #fff; padding: 9px 16px; font-weight: 700; }
.btn:hover { filter: brightness(0.94); }

.card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
label { display: block; font-size: .78rem; font-weight: 700; margin: 10px 0 5px; color: var(--text); }
input[type=text], input[type=email], input[type=password], select, textarea {
  width: 100%; padding: 9px 11px; border: 1.5px solid var(--border); border-radius: 8px; font-family: inherit; font-size: .85rem;
}
textarea { min-height: 80px; resize: vertical; }

.modal-bg { position: fixed; inset: 0; background: rgba(20,30,32,.5); display: none; align-items: flex-start; justify-content: center; z-index: 500; overflow-y: auto; padding: 30px 12px; }
.modal-bg.show { display: flex; }
.modal { background: #fff; border-radius: 14px; max-width: 640px; width: 100%; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.modal-head h3 { font-size: 1.05rem; color: var(--primary-dark); }
.modal-close { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--muted); }
.comment { border-inline-start: 3px solid var(--primary); background: #f5fafa; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
.comment.internal { border-inline-start-color: var(--orange); background: #fef9f0; }
.comment .meta { font-size: .7rem; color: var(--muted); font-weight: 700; margin-bottom: 3px; }
.comment .body { white-space: pre-wrap; font-size: .84rem; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; margin: 10px 0; font-size: .84rem; }
.detail-grid .k { color: var(--muted); font-weight: 700; font-size: .72rem; }

@media (max-width: 900px) {
  .stats { grid-template-columns: repeat(3, 1fr); }
  table, thead, tbody, th, td, tr { display: block; }
  thead { display: none; }
  tbody tr { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; padding: 6px; }
  td { border: none; padding: 5px 8px; }
  td:before { content: attr(data-label); font-weight: 800; color: var(--muted); display: inline-block; min-width: 90px; font-size: .7rem; }
}
</style>
</head>
<body>
<div class="topbar">
  {% if config.LOGO_URL %}<img src="{{ config.LOGO_URL }}" alt="{{ 'شعار المؤسسة' if lang=='ar' else 'Org logo' }}">{% endif %}
  <div class="topbar-title" id="orgTitle"></div>
  <span class="staff-chip" id="staffChip"></span>
  <button onclick="toggleLang()" title="{{ 'تبديل اللغة' if lang=='ar' else 'Switch language' }}"><i class="fas fa-globe"></i> <span id="langBtnLbl"></span></button>
  <a href="#" class="tb-btn" id="installBtn" style="display:none" onclick="handleInstallClick(event)" title="{{ 'تثبيت لوحة التحكم على الجهاز' if lang=='ar' else 'Install the control panel on this device' }}">
    <i class="fas fa-download"></i> <span id="installLbl"></span>
  </a>
  <a href="/admin/logout" class="tb-btn" title="{{ 'تسجيل الخروج' if lang=='ar' else 'Log out' }}"><i class="fas fa-sign-out-alt"></i> <span id="logoutLbl"></span></a>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="tickets" onclick="switchTab('tickets')"><i class="fas fa-ticket-alt"></i> <span id="tabTicketsLbl"></span></button>
  <button class="tab-btn" data-tab="categories" onclick="switchTab('categories')" id="catTabBtn"><i class="fas fa-tags"></i> <span id="tabCatLbl"></span></button>
  <button class="tab-btn" data-tab="teachers" onclick="switchTab('teachers')"><i class="fas fa-chalkboard-teacher"></i> <span id="tabTeachLbl"></span></button>
  <button class="tab-btn" data-tab="staff" onclick="switchTab('staff')" id="staffTabBtn" style="display:none"><i class="fas fa-users-cog"></i> <span id="tabStaffLbl"></span></button>
</div>

<div class="wrap">

  <!-- ── TICKETS TAB ─────────────────────────────────────────────── -->
  <div id="tab-tickets">
    <div class="stats" id="statCards"></div>
    <div class="toolbar">
      <input type="search" id="searchBox" oninput="renderTickets()" placeholder="">
      <select id="filterCategory" onchange="loadTickets()"></select>
      <select id="filterAssignee" onchange="loadTickets()" style="display:none"></select>
      <select id="filterUrgent" onchange="renderTickets()">
        <option value="0"></option>
        <option value="1"></option>
      </select>
      <label style="display:flex;align-items:center;gap:6px;margin:0;font-weight:600">
        <input type="checkbox" id="filterArchived" onchange="loadTickets()" style="width:auto"> <span id="archivedLbl"></span>
      </label>
    </div>
    <div style="overflow-x:auto">
    <table>
      <thead><tr>
        <th onclick="sortBy('serial')" id="thSerial"></th>
        <th onclick="sortBy('teacherName')" id="thTeacher"></th>
        <th onclick="sortBy('category')" id="thCategory"></th>
        <th onclick="sortBy('subject')" id="thSubject"></th>
        <th onclick="sortBy('assigneeName')" id="thAssignee"></th>
        <th onclick="sortBy('status')" id="thStatus"></th>
        <th onclick="sortBy('createdAt')" id="thCreated"></th>
        <th id="thActions"></th>
      </tr></thead>
      <tbody id="ticketsBody"></tbody>
    </table>
    </div>
  </div>

  <!-- ── CATEGORIES TAB ─────────────────────────────────────────── -->
  <div id="tab-categories" style="display:none">
    <div class="card">
      <h3 id="addCatTitle" style="margin-bottom:10px"></h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input type="text" id="newCatAr" placeholder="" style="flex:1;min-width:160px">
        <input type="text" id="newCatEn" placeholder="" style="flex:1;min-width:160px">
        <button class="btn btn-primary" onclick="addCategory()" id="addCatBtn"></button>
      </div>
    </div>
    <div id="categoriesList"></div>
  </div>

  <!-- ── TEACHERS TAB ──────────────────────────────────────────────── -->
  <div id="tab-teachers" style="display:none">
    <div class="card" id="addTeacherCard">
      <h3 id="addTeacherTitle" style="margin-bottom:10px"></h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input type="text" id="newTeacherName" placeholder="" style="flex:2;min-width:160px">
        <input type="text" id="newTeacherEmail" placeholder="" style="flex:2;min-width:160px">
        <input type="text" id="newTeacherPhone" placeholder="" style="flex:1;min-width:120px">
        <button class="btn btn-primary" onclick="addTeacher()" id="addTeacherBtn"></button>
      </div>
    </div>
    <div style="overflow-x:auto">
    <table><thead><tr>
      <th id="thTName"></th><th id="thTEmail"></th><th id="thTPhone"></th><th id="thTActive"></th><th id="thTActions"></th>
    </tr></thead><tbody id="teachersBody"></tbody></table>
    </div>
  </div>

  <!-- ── STAFF TAB (Administrator only) ──────────────────────────── -->
  <div id="tab-staff" style="display:none">
    <div class="card" id="addStaffCard">
      <h3 id="addStaffTitle" style="margin-bottom:10px"></h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px">
        <input type="text" id="newStaffUsername" placeholder="">
        <input type="text" id="newStaffFullName" placeholder="">
        <input type="email" id="newStaffEmail" placeholder="">
        <input type="password" id="newStaffPassword" placeholder="">
        <select id="newStaffRole"></select>
        <button class="btn btn-primary" onclick="addStaff()" id="addStaffBtn"></button>
      </div>
    </div>
    <div style="overflow-x:auto">
    <table><thead><tr>
      <th id="thSName"></th><th id="thSUser"></th><th id="thSRole"></th><th id="thSActive"></th><th id="thSActions"></th>
    </tr></thead><tbody id="staffBody"></tbody></table>
    </div>
  </div>

</div>

<!-- ── Ticket detail modal ("Open Ticket") ─────────────────────────── -->
<div class="modal-bg" id="detailModal"><div class="modal" id="detailModalBody"></div></div>

<script>
const ME = {{ me|tojson }};
let AR = (localStorage.getItem('adminLang') || '{{ lang }}') !== 'en';

const I18N_EN = {
  'إدارة تذاكر الدعم الفني': 'IT Support Ticketing — Admin',
  'التذاكر': 'Tickets', 'التصنيفات': 'Categories', 'المعلمون': 'Teachers', 'الموظفون': 'Staff Accounts',
  'خروج': 'Logout', 'تثبيت': 'Install', 'EN': 'AR',
  'الإجمالي': 'Total', 'مفتوحة': 'Open', 'قيد المعالجة': 'In Progress', 'مغلقة': 'Closed',
  'عاجلة': 'Urgent', 'غير معينة': 'Unassigned',
  'بحث برقم التذكرة، الموضوع، أو اسم المعلم...': 'Search by serial, subject, or teacher name...',
  'كل التصنيفات': 'All Categories', 'كل الموظفين': 'All Staff', 'غير معينة (فلتر)': 'Unassigned only',
  'كل الطلبات': 'All requests', 'العاجلة فقط': 'Urgent only', 'عرض المؤرشفة': 'Show archived',
  'الرقم': 'Serial', 'المعلم': 'Teacher', 'التصنيف': 'Category', 'الموضوع': 'Subject',
  'الموظف المسؤول': 'Assignee', 'الحالة': 'Status', 'التاريخ': 'Date', 'إجراءات': 'Actions',
  'عرض': 'View', 'تعيين': 'Assign', 'إغلاق': 'Close', 'إعادة فتح': 'Reopen', 'أرشفة': 'Archive',
  'طباعة': 'Print', 'دمج': 'Merge',
  'إضافة تصنيف جديد': 'Add New Category', 'الاسم بالعربي': 'Name (Arabic)', 'الاسم بالإنجليزي': 'Name (English)',
  'إضافة': 'Add', 'غير نشط': 'Inactive', 'نشط': 'Active', 'حذف': 'Delete', 'تعديل': 'Edit',
  'إضافة معلم جديد': 'Add New Teacher', 'الاسم': 'Name', 'البريد الإلكتروني': 'Email', 'الهاتف': 'Phone',
  'إضافة موظف دعم جديد': 'Add New Staff Account', 'اسم المستخدم': 'Username', 'الاسم الكامل': 'Full Name',

  'إضافة عنصر فرعي': 'Add sub-item', 'العناصر الفرعية': 'Sub-items',
  'تفاصيل التذكرة': 'Ticket Details', 'إغلاق النافذة': 'Close window',
  'مقدّم الطلب': 'Requested by', 'البريد': 'Email', 'الهاتف': 'Phone', 'الموقع': 'Location',
  'الوصف': 'Description', 'طلب عاجل': 'Urgent request', 'نعم': 'Yes', 'لا': 'No',
  'سجل المتابعة': 'Follow-up Log', 'إضافة تعليق': 'Add Comment', 'ملاحظة داخلية (لا تظهر لمقدم الطلب)': 'Internal note (hidden from requester)',
  'إرسال': 'Send', 'تعيين إلى': 'Assign to', '-- بلا تعيين --': '-- Unassigned --', 'حفظ التعيين': 'Save Assignment',
  'تعليق الإغلاق (اختياري)': 'Closing comment (optional)', 'تأكيد الإغلاق': 'Confirm Close',
  'أدخل الرقم التسلسلي للتذكرة الأخرى للدمج معها:': "Enter the other ticket's serial number to merge with:",
  'الدعم الفني': 'IT Support', 'المرفقات': 'Attachments', 'لا توجد تعليقات بعد': 'No comments yet',
  'هل أنت متأكد من حذف هذا التصنيف؟': 'Delete this category?', 'هل أنت متأكد من حذف هذا العنصر؟': 'Delete this item?',
  'هل أنت متأكد من حذف هذا المعلم؟': 'Delete this teacher?', 'هل أنت متأكد من تعطيل هذا الحساب؟': 'Deactivate this account?',
  'يرجى كتابة تعليق': 'Please write a comment', 'حدث خطأ': 'Something went wrong',
  'تم دمج هذه التذكرة مع #': 'This ticket was merged into #', 'مدمجة': 'Merged',
};

function t(s) { return AR ? s : (I18N_EN[s] || s); }

async function api(url, method, body) {
  const opts = { method: method || 'GET', headers: {} };
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(url, opts);
  if (r.status === 204) return null;
  const data = await r.json().catch(() => null);
  if (!r.ok) { alert((data && data.error) || t('حدث خطأ')); throw new Error('api error'); }
  return data;
}

function toggleLang() {
  AR = !AR;
  localStorage.setItem('adminLang', AR ? 'ar' : 'en');
  document.documentElement.lang = AR ? 'ar' : 'en';
  document.documentElement.dir = AR ? 'rtl' : 'ltr';
  paintStaticLabels();
  renderStatCards();
  renderTickets();
  renderCategories();
  renderTeachers();
  renderStaff();
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── Static label painting (topbar / tabs / toolbar / table headers) ──────

  document.getElementById('newCatAr').placeholder = t('الاسم بالعربي');
  document.getElementById('newCatEn').placeholder = t('الاسم بالإنجليزي');
  document.getElementById('addCatBtn').textContent = t('إضافة');
  document.getElementById('addTeacherTitle').textContent = t('إضافة معلم جديد');
  document.getElementById('newTeacherName').placeholder = t('الاسم');
  document.getElementById('newTeacherEmail').placeholder = t('البريد الإلكتروني');
  document.getElementById('newTeacherPhone').placeholder = t('الهاتف');
  document.getElementById('addTeacherBtn').textContent = t('إضافة');

  document.getElementById('thTActive').textContent = t('مفعّل');
  document.getElementById('thTActions').textContent = t('إجراءات');
  document.getElementById('addStaffTitle').textContent = t('إضافة موظف دعم جديد');
  document.getElementById('newStaffUsername').placeholder = t('اسم المستخدم للدخول');
  document.getElementById('newStaffFullName').placeholder = t('الاسم الكامل');
  document.getElementById('newStaffEmail').placeholder = t('البريد الإلكتروني');
  document.getElementById('newStaffPassword').placeholder = t('كلمة المرور');
  document.getElementById('addStaffBtn').textContent = t('إضافة');
  document.getElementById('newStaffRole').innerHTML =
    `<option value="technical_support">${t('دعم فني')}</option><option value="system_admin">${t('مسؤول نظام')}</option><option value="administrator">${t('مدير عام')}</option>`;

  document.getElementById('thSActive').textContent = t('مفعّل');
  document.getElementById('thSActions').textContent = t('إجراءات');

    `<option value="0">${t('كل الطلبات')}</option><option value="1">${t('العاجلة فقط')}</option>`;

function switchTab(name) {

// ── TICKETS ──────────────────────────────────────────────────────────────
let TICKETS = [], CATEGORIES = [], STAFF_LIST = [];
let ticketSort = { key: 'createdAt', dir: 'desc' };

function statusLabel(s) { return AR ? ({open:'مفتوحة',in_progress:'قيد المعالجة',closed:'مغلقة'}[s]) : ({open:'Open',in_progress:'In Progress',closed:'Closed'}[s]); }

async function loadTickets() {
  const params = new URLSearchParams();
  const statCat = document.getElementById('filterCategory').value;
  const assignee = document.getElementById('filterAssignee').value;
  if (statCat) params.set('category_id', statCat);
  if (assignee) params.set('assignee_id', assignee);
  if (document.getElementById('filterArchived').checked) params.set('archived', '1');
  // Status is deliberately NOT sent to the server here: we want the stat
  // cards to reflect the full distribution across statuses for the
  // current category/assignee/archived scope, then filter by status
  // client-side in renderTickets() — otherwise clicking "Open" would make
  // the "Closed"/"In Progress" counts collapse to zero.
  TICKETS = await api('/admin/api/tickets?' + params.toString());
  renderStatCards();
  renderTickets();
}

function renderStatCards() {
  const all = TICKETS;
  const counts = {
    total: all.length,
    open: all.filter(x => x.status === 'open').length,
    in_progress: all.filter(x => x.status === 'in_progress').length,
    closed: all.filter(x => x.status === 'closed').length,
    urgent: all.filter(x => x.urgent).length,
    unassigned: all.filter(x => !x.assigneeId).length,
  };
  const defs = [
    ['total', 'الإجمالي', 'clear'], ['open', 'مفتوحة', 'open'], ['in_progress', 'قيد المعالجة', 'in_progress'],
    ['closed', 'مغلقة', 'closed'], ['urgent', 'عاجلة', 'urgent'], ['unassigned', 'غير معينة', 'unassigned'],
  ];
  const isOn = (key) => {
    if (key === 'urgent') return document.getElementById('filterUrgent').value === '1';
    if (key === 'unassigned') return document.getElementById('filterAssignee').value === 'unassigned';
    return window.currentStatFilter === key;
  };
  document.getElementById('statCards').innerHTML = defs.map(([key, label, action]) => `
    <div class="stat-card ${isOn(key) ? 'on' : ''}" onclick="filterByStat('${action}')" title="${t(label)}">
      <div class="stat-val">${counts[key]}</div><div class="stat-label">${t(label)}</div>
    </div>`).join('');
}

function filterByStat(action) {
  if (action === 'urgent') {
    document.getElementById('filterUrgent').value = document.getElementById('filterUrgent').value === '1' ? '0' : '1';
    renderStatCards(); renderTickets();
    return;
  }
  if (action === 'unassigned') {
    const el = document.getElementById('filterAssignee');
    el.value = el.value === 'unassigned' ? '' : 'unassigned';
    loadTickets();
    return;
  }
  window.currentStatFilter = (action === 'clear' || action === window.currentStatFilter) ? null : action;
  renderStatCards(); renderTickets();
}

function sortBy(key) {
  if (ticketSort.key === key) ticketSort.dir = ticketSort.dir === 'asc' ? 'desc' : 'asc';
  else { ticketSort.key = key; ticketSort.dir = 'asc'; }
  renderTickets();
}

function renderTickets() {
  let rows = TICKETS.slice();
  if (window.currentStatFilter) rows = rows.filter(r => r.status === window.currentStatFilter);
  const urgentOnly = document.getElementById('filterUrgent').value === '1';
  if (urgentOnly) rows = rows.filter(r => r.urgent);
  const q = (document.getElementById('searchBox').value || '').toLowerCase();
  if (q) rows = rows.filter(r => (String(r.serial) + r.subject + r.teacherName + r.trackingCode).toLowerCase().includes(q));
  rows.sort((a, b) => {
    let av = a[ticketSort.key], bv = b[ticketSort.key];
    if (av == null) av = ''; if (bv == null) bv = '';
    if (av < bv) return ticketSort.dir === 'asc' ? -1 : 1;
    if (av > bv) return ticketSort.dir === 'asc' ? 1 : -1;
    return 0;
  });

  document.getElementById('ticketsBody').innerHTML = rows.map(tk => {
    const hoverTitle = `${AR ? 'التذكرة' : 'Ticket'} #${tk.serial} — ${esc(tk.subject)} — ${esc(tk.teacherName)} — ${esc(tk.category)}`;
    const canManage = ME.role !== 'technical_support' || tk.assigneeId === ME.id;
    const canAssign = ME.role !== 'technical_support';
    let actions = `<button class="btn btn-blue" onclick="openDetail(${tk.id})" title="${t('عرض')}"><i class="fas fa-eye"></i></button>`;
    if (canAssign) actions += `<button class="btn btn-outline" onclick="openDetail(${tk.id},'assign')" title="${t('تعيين')}"><i class="fas fa-user-tag"></i></button>`;
    if (tk.status !== 'closed' && canManage) {
      actions += `<button class="btn btn-green" onclick="openDetail(${tk.id},'close')" title="${t('إغلاق')}"><i class="fas fa-check"></i></button>`;
    }
    if (tk.status === 'closed' && canManage && !tk.mergedIntoId) {
      actions += `<button class="btn btn-orange" onclick="doReopen(${tk.id})" title="${t('إعادة فتح')}"><i class="fas fa-undo"></i></button>`;
      if (!tk.archived) actions += `<button class="btn btn-outline" onclick="doArchive(${tk.id})" title="${t('أرشفة')}"><i class="fas fa-box-archive"></i></button>`;
    }
    actions += `<a class="btn btn-outline" href="/admin/ticket/${tk.id}/print" target="_blank" title="${t('طباعة')}"><i class="fas fa-print"></i></a>`;
    if (canManage && tk.status !== 'closed') actions += `<button class="btn btn-outline" onclick="promptMerge(${tk.id})" title="${t('دمج')}"><i class="fas fa-code-merge"></i></button>`;

    return `<tr title="${hoverTitle}">
      <td data-label="${t('الرقم')}"><strong style="color:var(--primary-dark)">#${tk.serial}</strong>${tk.mergedIntoId ? ` <span class="badge" style="background:#eee;color:#888">${t('مدمجة')}</span>` : ''}</td>
      <td data-label="${t('المعلم')}">${esc(tk.teacherName)}</td>
      <td data-label="${t('التصنيف')}">${esc(tk.category)}${tk.categoryItem ? ' / ' + esc(tk.categoryItem) : ''}</td>
      <td data-label="${t('الموضوع')}" title="${esc(tk.subject)}" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${tk.urgent ? '<span class="urgent-flag" title="'+t('طلب عاجل')+'">●</span> ' : ''}${esc(tk.subject)}</td>
      <td data-label="${t('الموظف المسؤول')}">${esc(tk.assigneeName || (AR ? 'غير معيّن' : 'Unassigned'))}</td>
      <td data-label="${t('الحالة')}"><span class="badge badge-${tk.status}">${statusLabel(tk.status)}</span></td>
      <td data-label="${t('التاريخ')}">${(tk.createdAt || '').slice(0, 16).replace('T', ' ')}</td>
      <td data-label="${t('إجراءات')}">${actions}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:20px">${t('لا توجد نتائج')}</td></tr>`;
}

function closeDetail() { document.getElementById('detailModal').classList.remove('show'); }

async function doAssign(id) {
  const val = document.getElementById('assigneeSelect').value;
  await api(`/admin/api/tickets/${id}/assign`, 'POST', { assigneeId: val ? parseInt(val, 10) : null });
  await loadTickets();
  openDetail(id);
}

async function doComment(id) {
  const body = document.getElementById('newCommentBody').value.trim();
  if (!body) { alert(t('يرجى كتابة تعليق')); return; }
  const internal = document.getElementById('newCommentInternal').checked;
  await api(`/admin/api/tickets/${id}/comment`, 'POST', { body, internal });
  await loadTickets();
  openDetail(id);
}

function promptClose(id) {
  const note = prompt(t('تعليق الإغلاق (اختياري)') + ':') || '';
  if (note === null) return;
  api(`/admin/api/tickets/${id}/close`, 'POST', { comment: note }).then(() => { loadTickets(); closeDetail(); });
}

async function doReopen(id) { await api(`/admin/api/tickets/${id}/reopen`, 'POST'); loadTickets(); }
async function doArchive(id) { await api(`/admin/api/tickets/${id}/archive`, 'POST'); loadTickets(); }

function promptMerge(id) {
  const other = prompt(t('أدخل الرقم التسلسلي للتذكرة الأخرى للدمج معها:'));
  if (!other) return;
  const otherTicket = TICKETS.find(x => String(x.serial) === String(other).trim());
  if (!otherTicket) { alert(t('حدث خطأ')); return; }
  api('/admin/api/tickets/merge', 'POST', { ticketIdA: id, ticketIdB: otherTicket.id })
    .then(() => { loadTickets(); closeDetail(); });
}

  const password = document.getElementById('newStaffPassword').value;
  const email = document.getElementById('newStaffEmail').value.trim();
  const role = document.getElementById('newStaffRole').value;
  if (!username || !fullName || !password) return;
  await api('/admin/api/staff', 'POST', { username, fullName, password, email, role });
  ['newStaffUsername','newStaffFullName','newStaffEmail','newStaffPassword'].forEach(id => document.getElementById(id).value = '');
  loadStaff();
}
async function toggleStaffActive(id, active) { if (!active && !confirm(t('هل أنت متأكد من تعطيل هذا الحساب؟'))) return; await api(`/admin/api/staff/${id}`, 'PUT', { active }); loadStaff(); }
async function deleteStaff(id) { if (!confirm(t('هل أنت متأكد من تعطيل هذا الحساب؟'))) return; await api(`/admin/api/staff/${id}`, 'DELETE'); loadStaff(); }

// ── PWA install + service worker (same behaviour as the public site) ─────
let deferredInstallPrompt = null;
const installBtn = document.getElementById('installBtn');
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
if (!isStandalone) {
  if (isIOS) { installBtn.style.display = 'flex'; }
  else window.addEventListener('beforeinstallprompt', e => { deferredInstallPrompt = e; installBtn.style.display = 'flex'; });
}
function handleInstallClick(e) {
  e.preventDefault();
  if (isIOS) { alert(AR ? 'لإضافة التطبيق للشاشة الرئيسية اضغط زر المشاركة ثم Add to Home Screen' : 'Tap Share, then "Add to Home Screen"'); return; }
  if (deferredInstallPrompt) { deferredInstallPrompt.prompt(); deferredInstallPrompt.userChoice.finally(() => { deferredInstallPrompt = null; installBtn.style.display = 'none'; }); }
}
window.addEventListener('appinstalled', () => installBtn.style.display = 'none');

// ── Web Push subscription (best-effort; ignored if unsupported) ─────────
async function registerPush() {
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
    const reg = await navigator.serviceWorker.ready;
    const { key } = await api('/admin/api/vapid-public-key');
    if (!key) return;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') return;
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(key) });
    }
    await api('/admin/api/push-subscribe', 'POST', sub.toJSON());
  } catch (e) { /* best-effort */ }
}
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

// ── Init ──────────────────────────────────────────────────────────────────
(async function init() {
  paintStaticLabels();
  await loadFilterOptions();
  await loadTickets();
  registerPush();
  setInterval(loadTickets, 60000);
})();
