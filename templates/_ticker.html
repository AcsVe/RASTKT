<!-- ── Global scrolling ticker (announcement marquee) ───────────────────────
     Fully transparent background, bold white text with a soft shadow for
     legibility over any page background, fades out at the left/right
     edges via a CSS mask, and mirrors its scroll direction automatically
     with the page's current language (RTL for Arabic, LTR otherwise). -->
<style>
  #globalTicker {
    width: 100%; overflow: hidden; position: relative;
    padding: 7px 0;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 60px, #000 calc(100% - 60px), transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, #000 60px, #000 calc(100% - 60px), transparent 100%);
    display: none; /* JS reveals this once content is confirmed non-empty */
  }
  #globalTicker .ticker-track { display: flex; width: max-content; will-change: transform; }
  #globalTicker .ticker-seg { display: flex; align-items: center; white-space: nowrap; }
  #globalTicker .ticker-item {
    color: #fff; font-weight: 800; font-size: 1rem;
    text-shadow: 0 1px 3px rgba(0,0,0,.6), 0 0 2px rgba(0,0,0,.45);
    padding-inline-end: 46px;
  }
  #globalTicker .ticker-item a { color: inherit; text-decoration: underline; }
  #globalTicker .ticker-item img.ticker-logo { height: 22px; vertical-align: middle; margin-inline-end: 10px; }
  @keyframes ticker-scroll-ltr { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes ticker-scroll-rtl { from { transform: translateX(0); } to { transform: translateX(50%); } }
  #globalTicker .ticker-track.dir-ltr { animation-name: ticker-scroll-ltr; }
  #globalTicker .ticker-track.dir-rtl { animation-name: ticker-scroll-rtl; }
  #globalTicker .ticker-track { animation-timing-function: linear; animation-iteration-count: infinite; }
  @keyframes ticker-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  #globalTicker .ticker-track.pulse-on { animation-name: ticker-scroll-ltr, ticker-pulse; animation-iteration-count: infinite, infinite; animation-timing-function: linear, ease-in-out; }
  #globalTicker .ticker-track.pulse-on.dir-rtl { animation-name: ticker-scroll-rtl, ticker-pulse; }
  @media (max-width: 640px) {
    #globalTicker { -webkit-mask-image: linear-gradient(to right, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%); mask-image: linear-gradient(to right, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%); }
    #globalTicker .ticker-item { font-size: .88rem; padding-inline-end: 30px; }
  }
</style>
<div id="globalTicker"><div class="ticker-track" id="tickerTrack"></div></div>
<script>
(function () {
  const ORG_LOGO = {{ (config.LOGO_URL or '')|tojson }};
  const PAGE_LANG = {{ (lang or 'ar')|tojson }};

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function extractSegments(html) {
    if (!html) return [];
    const matches = [...html.matchAll(/<p[^>]*>([\s\S]*?)<\/p>/gi)];
    const blocks = matches.length ? matches.map(m => m[1]) : [html];
    return blocks
      .map(b => b.replace(/<br\s*\/?>/gi, '').trim())
      .filter(b => b && b.replace(/&nbsp;/gi, '').trim());
  }

  fetch('/api/ticker').then(r => r.json()).then(data => {
    if (!data || !data.enabled) return;

    const contentHtml = PAGE_LANG === 'en' ? (data.htmlEn || data.html) : (data.html || data.htmlEn);
    const manualSegments = extractSegments(contentHtml);
    const rssSegments = (data.rssItems || []).map(it =>
      it.link ? `<a href="${it.link}" target="_blank" rel="noopener">${escapeHtml(it.title)}</a>` : escapeHtml(it.title)
    );
    const segments = [...manualSegments, ...rssSegments];
    if (!segments.length) return;

    const sep = (data.logoBetween && ORG_LOGO) ? `<img class="ticker-logo" src="${ORG_LOGO}" alt="">` : '';
    const itemsHtml = segments.map(s => `<span class="ticker-item">${sep}${s}</span>`).join('');

    const track = document.getElementById('tickerTrack');
    track.innerHTML = `<span class="ticker-seg">${itemsHtml}</span><span class="ticker-seg" aria-hidden="true">${itemsHtml}</span>`;

    const isRtl = document.documentElement.dir === 'rtl';
    track.classList.add(isRtl ? 'dir-rtl' : 'dir-ltr');
    let duration = `${data.speedSeconds || 25}s`;
    if (data.pulse) {
      track.classList.add('pulse-on');
      duration += `, ${data.pulseSeconds || 1.6}s`;
    }
    track.style.animationDuration = duration;

    document.getElementById('globalTicker').style.display = 'block';
  }).catch(() => {});
})();
</script>
